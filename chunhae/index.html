<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>유창성장애 기말 총정리 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--pink:#ffd6e0;--pink2:#ff8fab;--mint:#d4f5e4;--mint2:#4cc38a;--yel:#fff3bf;--yel2:#f7b731;--sky:#d6ecff;--ink:#4a3b52;--bg:#fff8f0;--card:#fff;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background-image:radial-gradient(var(--pink) 2px,transparent 2px),radial-gradient(var(--sky) 2px,transparent 2px);background-size:36px 36px;background-position:0 0,18px 18px}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 40px}
.wrap.wide{max-width:1240px}
.card{background:var(--card);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:26px 24px}
h1{margin:0;font-size:clamp(30px,6vw,52px);text-align:center;line-height:1.25}
h2{font-size:clamp(22px,3.4vw,30px)}h3{margin:22px 0 10px;font-size:22px;font-weight:normal}
.mascot{font-size:clamp(70px,14vw,120px);text-align:center;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.sub{text-align:center;font-size:clamp(18px,3vw,24px);margin:8px 0 22px}
.btn{font-family:inherit;font-size:clamp(20px,3.4vw,28px);background:var(--yel2);color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:.08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.6;cursor:default}
.btn.sm{font-size:18px;padding:6px 16px;border-width:3px;box-shadow:0 4px 0 var(--ink)}
.btn.alt{background:var(--sky)}.btn.red{background:var(--pink2)}
.center{text-align:center}
.inp{font-family:inherit;font-size:26px;color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:10px 16px;width:100%;max-width:380px;text-align:center;outline:none}
.inp:focus{background:var(--yel)}
.link{background:none;border:none;font-family:inherit;color:var(--ink);opacity:.55;text-decoration:underline;cursor:pointer;font-size:16px;margin-top:22px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:clamp(18px,3vw,24px)}
.bar{flex:1;height:22px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink2),var(--yel2));transition:width .4s}
.score{background:var(--yel);border:3px solid var(--ink);border-radius:999px;padding:2px 14px}
.tag{display:inline-block;background:var(--sky);border:3px solid var(--ink);border-radius:999px;padding:2px 14px;font-size:clamp(15px,2.4vw,20px);margin-bottom:10px}
.q{font-size:clamp(24px,4.4vw,38px);line-height:1.4;margin:6px 0 20px;word-break:keep-all}
.opts{display:grid;gap:14px}
.opt{font-family:inherit;text-align:left;font-size:clamp(20px,3.4vw,30px);line-height:1.35;color:var(--ink);background:var(--pink);border:4px solid var(--ink);border-radius:22px;padding:14px 18px;cursor:pointer;box-shadow:0 6px 0 var(--ink);display:flex;gap:14px;align-items:center;word-break:keep-all;transition:.08s}
.opt:nth-child(2){background:var(--mint)}.opt:nth-child(3){background:var(--yel)}.opt:nth-child(4){background:var(--sky)}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.opt .n{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:26px}
.opt:disabled{cursor:default}
.opt.right{background:var(--mint2)!important;animation:pop .5s}
.opt.wrong{background:var(--bad)!important;animation:shake .4s;color:#fff}
.opt.dim{opacity:.45}
.ox{grid-template-columns:1fr 1fr}.ox .opt{justify-content:center;font-size:clamp(34px,7vw,64px);padding:22px}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin-top:20px;border:4px dashed var(--ink);border-radius:22px;padding:14px 18px;background:#fffdf5;font-size:clamp(18px,3vw,26px);line-height:1.5;display:none;word-break:keep-all}
.fb.show{display:block;animation:pop .4s}
.fb b{font-size:1.15em}
.next{margin-top:20px;display:none;text-align:right}.next.show{display:block}
.hint{text-align:center;margin-top:16px;font-size:16px;opacity:.7}
.big{font-size:clamp(54px,12vw,110px);text-align:center;line-height:1.1}
.res{font-size:clamp(22px,4vw,34px);text-align:center;margin:10px 0 20px}
.wrongs{margin:16px 0 0;padding:0;list-style:none;font-size:clamp(16px,2.6vw,22px);text-align:left}
.wrongs li{background:var(--pink);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.conf{position:fixed;top:-20px;font-size:28px;pointer-events:none;animation:fall 1.6s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
/* 교사 대시보드 */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0 0}
.stat{background:var(--yel);border:3px solid var(--ink);border-radius:18px;padding:10px;text-align:center;font-size:18px}
.stat:nth-child(2){background:var(--mint)}.stat:nth-child(3){background:var(--pink)}.stat:nth-child(4){background:var(--sky)}
.stat b{display:block;font-size:40px;font-weight:normal}
.qbars{display:grid;gap:6px}
.qb{display:grid;grid-template-columns:48px 1fr 110px;gap:10px;align-items:center;cursor:pointer;font-size:18px;padding:3px 8px;border-radius:12px}
.qb:hover,.qb.sel{background:var(--yel)}
.qb.low .bar>i{background:var(--bad)}
.qb .bar{height:20px}
.dr{display:grid;grid-template-columns:1fr minmax(100px,220px) 54px;gap:10px;align-items:center;margin-top:8px;font-size:.85em}
.dr.ok{color:#1e7a4f}.dr .bar{height:16px}.dr.ok .bar>i{background:var(--mint2)}
.tbl{overflow:auto;max-height:62vh;border:3px solid var(--ink);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{border:1.5px solid #c9bfd0;padding:5px 6px;text-align:center}
th{background:var(--sky);position:sticky;top:0;z-index:1}
td.nm{text-align:left;white-space:nowrap}
td.c-ok{background:var(--mint)}td.c-no{background:#ffd3d3}
.wait{font-size:22px;padding:30px 10px}
.live{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--mint2);margin-right:6px;animation:blink 1s infinite;vertical-align:middle}
@keyframes blink{50%{opacity:.2}}
.ov{position:fixed;inset:0;background:rgba(74,59,82,.6);display:grid;place-items:center;z-index:20;padding:16px}
.ov .card{max-width:760px;width:100%;text-align:center;max-height:96vh;overflow:auto}
#qr{display:inline-block;background:#fff;padding:16px;border:4px solid var(--ink);border-radius:20px;margin:14px 0}
#qr img,#qr canvas{display:block;width:min(58vh,70vw);height:auto}
td.tm{white-space:nowrap;font-size:15px}
.tmr{white-space:nowrap}.tmr.low{background:var(--bad);color:#fff;animation:blink 1s infinite}
.timeup{background:var(--bad);color:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-size:clamp(20px,3.6vw,30px);text-align:center;margin:0 0 12px}
/* ================= 리포트 v2 ================= */
:root{--okc:#2fb879;--midc:#f59f00;--lowc:#f0506e}
.wrap.rpw{max-width:1040px}
.rp{text-align:left}
.sec{background:#fff;border:3px solid var(--ink);border-radius:26px;padding:20px 22px;margin:18px 0;box-shadow:0 6px 0 var(--ink);position:relative}
.sec h3{margin:0;font-size:clamp(21px,3vw,27px);display:flex;align-items:center;gap:10px}
.sec h3 .no{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-size:17px;flex:none}
.sec .cap{margin:4px 0 14px;opacity:.62;font-size:15px;line-height:1.5}
.hero{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center;background:linear-gradient(120deg,#fff0f4 0%,#fff8e1 50%,#e8f6ff 100%);overflow:hidden}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(255,255,255,0) 70%);pointer-events:none}
.hero .who{font-size:16px;opacity:.65}.hero h2{margin:2px 0 10px;font-size:clamp(26px,4.4vw,40px);line-height:1.2}
.lvb{display:inline-flex;align-items:center;gap:8px;padding:4px 18px;border-radius:999px;border:3px solid var(--ink);background:#fff;font-size:clamp(18px,2.6vw,24px);box-shadow:0 4px 0 var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chip{border:2px solid var(--ink);border-radius:999px;padding:3px 13px;background:#fff;font-size:16px;white-space:nowrap}
.chip.hot{background:var(--ink);color:#fff}
.diag{margin-top:14px;font-size:clamp(17px,2.4vw,21px);line-height:1.65;word-break:keep-all;background:rgba(255,255,255,.75);border-radius:16px;padding:10px 14px;border:2px dashed var(--ink)}
.diag b{background:linear-gradient(transparent 58%,#ffe066 58%)}
.ringbox{position:relative;width:min(220px,46vw);aspect-ratio:1}
.ringbox svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.ringbox .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ringbox .ctr b{font-size:clamp(46px,9vw,72px);font-weight:normal}.ringbox .ctr b small{font-size:.4em}
.ringbox .ctr span{font-size:17px;opacity:.7;margin-top:6px}
.duo{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:center}
.duo svg{width:100%;height:auto;display:block;overflow:visible}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;margin-top:6px;justify-content:center}
.lg i{display:inline-block;width:22px;height:10px;border-radius:4px;margin-right:5px;vertical-align:middle}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.pcard{border:3px solid var(--ink);border-radius:20px;padding:16px 14px 12px;background:#fff;position:relative;overflow:hidden}
.pcard::before{content:'';position:absolute;left:0;top:0;right:0;height:9px;background:var(--pc)}
.pcard .ph{display:flex;align-items:center;gap:10px}
.pcard .ph svg{width:64px;height:64px;flex:none;transform:rotate(-90deg)}
.pcard .pn{font-size:19px;line-height:1.25;word-break:keep-all}.pcard .pn small{display:block;font-size:14px;opacity:.6}
.pcard .big{font-size:30px;line-height:1;text-align:left}
.lv{font-style:normal;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:14px;white-space:nowrap;display:inline-block}
.lv.good{background:#c8f2dc}.lv.mid{background:#ffeab0}.lv.low{background:#ffd0d8}
.dl{font-size:14px;margin-left:4px}.dl.up{color:#1e8a57}.dl.dn{color:#d6334f}
.qds{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.qd{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px;border:2px solid var(--ink)}
.qd.ok{background:#c8f2dc}.qd.no{background:#ffd0d8}.qd.na{background:#eee;opacity:.6}.qd.fx{background:linear-gradient(135deg,#ffd0d8 50%,#c8f2dc 50%)}
.mx{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:center}
.mx svg{width:100%;height:auto;display:block}
.qlist{display:grid;gap:8px;font-size:16px;line-height:1.5}
.qlist div{border-left:6px solid var(--c);background:#faf7fc;border-radius:10px;padding:6px 10px;word-break:keep-all}
.jw{overflow-x:auto}.jw svg{display:block;min-width:560px;width:100%;height:auto}
.step{display:grid;grid-template-columns:72px 1fr;gap:14px;margin:14px 0;align-items:start}
.step .sn{background:var(--pc);border:3px solid var(--ink);border-radius:18px;text-align:center;padding:8px 0;font-size:14px;line-height:1.1;box-shadow:0 4px 0 var(--ink)}
.step .sn b{display:block;font-size:30px;font-weight:normal}
.step h4{margin:2px 0 6px;font-size:21px;font-weight:normal}
.gd{background:#f3fbff;border:2px solid #9fd2f5;border-radius:12px;padding:6px 12px;font-size:16px;margin:6px 0;line-height:1.5}
.wi{border:2px solid var(--ink);border-radius:14px;padding:8px 12px;margin:8px 0;background:#fffafb;font-size:clamp(15px,2.2vw,18px);line-height:1.55;word-break:keep-all}
.wi .an{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.wi .an span{border-radius:999px;padding:1px 10px;font-size:.88em;border:2px solid var(--ink)}
.wi .my{background:#ffd0d8}.wi .co{background:#c8f2dc}.wi .rt{background:#fff3bf}
.wi .ex{font-size:.92em;opacity:.85}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
.loading{text-align:center;padding:60px 10px;font-size:24px}
.spin{display:inline-block;width:46px;height:46px;border:6px solid var(--pink);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
/* 애니메이션 */
@keyframes ringd{from{stroke-dashoffset:var(--c)}}
@keyframes grow{from{transform:scale(0);opacity:0}}
@keyframes up{from{transform:translateY(16px);opacity:0}}
@keyframes barw{from{width:0}}
@keyframes bary{from{transform:scaleY(0)}}
@keyframes pin{from{opacity:0;transform:scale(0)}}
@keyframes dash{from{stroke-dashoffset:var(--l)}}
.anim .rg{animation:ringd 1.4s cubic-bezier(.2,.8,.2,1) both}
.anim .gr{animation:grow 1s cubic-bezier(.2,.9,.25,1.1) both}
.anim .sec{animation:up .6s ease both}
.anim .sec:nth-child(2){animation-delay:.08s}.anim .sec:nth-child(3){animation-delay:.16s}.anim .sec:nth-child(4){animation-delay:.24s}.anim .sec:nth-child(5){animation-delay:.32s}.anim .sec:nth-child(6){animation-delay:.4s}
.anim .bw{animation:barw 1.1s cubic-bezier(.2,.8,.2,1) both}
.anim .by{transform-box:fill-box;transform-origin:50% 100%;animation:bary .9s cubic-bezier(.2,.8,.2,1) both}
.anim .pi{transform-box:fill-box;transform-origin:center;animation:pin .5s cubic-bezier(.2,.9,.3,1.4) both}
.anim .ln{animation:dash 1.6s ease both}
/* 교사 분석 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.tabs button{font-family:inherit;font-size:19px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 16px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;box-shadow:0 4px 0 var(--yel2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{border:3px solid var(--ink);border-radius:20px;padding:12px 14px;background:var(--kc,#fff)}
.kpi span{font-size:15px;opacity:.75}.kpi b{display:block;font-size:38px;font-weight:normal;line-height:1.15}.kpi small{font-size:14px;opacity:.7}
.g2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.focus li{margin:6px 0;line-height:1.5;word-break:keep-all}
.focus{margin:0;padding-left:22px;font-size:17px}
.live-ch{display:flex;flex-wrap:wrap;gap:8px}
.live-ch span{border:2px solid var(--ink);border-radius:12px;padding:3px 10px;font-size:15px;background:#fff;position:relative;overflow:hidden}
.live-ch span i{position:absolute;left:0;bottom:0;height:4px;background:var(--mint2)}
.strip{display:grid;grid-template-columns:minmax(90px,160px) 1fr 120px;gap:12px;align-items:center;margin:10px 0;font-size:17px}
.strip svg{width:100%;height:auto;display:block;overflow:visible}
.qrow{display:grid;grid-template-columns:52px minmax(0,1fr) 150px minmax(140px,220px) 74px 62px;gap:10px;align-items:center;padding:8px 6px;border-bottom:1.5px solid #e6dfeb;font-size:16px;cursor:pointer}
.qrow:hover{background:#fffbea}.qrow.hd{font-size:14px;opacity:.65;cursor:default;background:none}
.qrow .qt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stk{display:flex;height:20px;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.stk i{display:block;height:100%;font-style:normal;font-size:11px;color:#fff;text-align:center;line-height:16px;overflow:hidden}
.mini{height:14px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}.mini i{display:block;height:100%}
.dc{border-radius:999px;padding:0 8px;font-size:13px;border:2px solid var(--ink);text-align:center}
.mcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mc{border:3px solid var(--ink);border-radius:18px;padding:12px 14px;background:#fff6f8;font-size:16px;line-height:1.5;word-break:keep-all}
.mc b.pct{font-size:34px;font-weight:normal;color:#d6334f;display:block;line-height:1.1}
.hm{border-collapse:separate;border-spacing:3px;font-size:14px}
.hm th,.hm td{border:none;padding:0}
.hm td.c{width:24px;height:24px;border-radius:6px}
.hm td.c.ok{background:#5fd39a}.hm td.c.no{background:#ff8fa3}.hm td.c.na{background:#eee}
.hm th.ph{font-size:13px;padding:2px 4px;border-radius:6px;color:#fff;white-space:nowrap}
.hm td.nm{padding:0 8px;white-space:nowrap;text-align:left;font-size:16px}
.hm td.sc{padding:0 8px;font-size:16px}
.hm tr:hover td.nm{background:var(--yel)}
.hmw{overflow:auto;max-height:70vh;border:3px solid var(--ink);border-radius:16px;padding:8px;background:#fff}
.conf{z-index:80!important}
/* 반응 속도 진단 */
.sq{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sq>div{border:3px solid var(--ink);border-radius:18px;padding:10px 14px}
.sq b.n{font-size:38px;font-weight:normal;line-height:1}
.sq .qd{width:26px;height:26px;font-size:12px}
.trk{display:grid;grid-template-columns:44px 1fr 70px;gap:10px;align-items:center;font-size:15px;margin:5px 0}
.tk{position:relative;height:16px;border-radius:999px;background:#f6f0f8;border:2px solid var(--ink)}
.tk .fz{position:absolute;left:0;top:0;bottom:0;background:#c8f2dc;border-radius:999px 0 0 999px}
.tk .md{position:absolute;top:-6px;bottom:-6px;width:3px;margin-left:-1px;background:#7048e8;border-radius:2px}
.tk .dot{position:absolute;top:50%;width:20px;height:20px;border-radius:50%;border:2.5px solid var(--ink);transform:translate(-50%,-50%)}
@keyframes slide{from{left:0}}
.anim .tk .dot{animation:slide 1.1s cubic-bezier(.2,.8,.2,1) both}
/* ===== 라이브 진행 (전자칠판) ===== */
.lvx{position:fixed;inset:0;z-index:60;color:#fff;font-family:'Jua','Malgun Gothic',sans-serif;display:flex;flex-direction:column;overflow:hidden;background:#1b1530}
.lvx::before{content:'';position:absolute;inset:-20%;background:radial-gradient(circle at 20% 20%,rgba(112,72,232,.6),transparent 40%),radial-gradient(circle at 80% 30%,rgba(255,122,162,.45),transparent 40%),radial-gradient(circle at 50% 90%,rgba(34,197,94,.32),transparent 45%);animation:drift 14s ease-in-out infinite alternate;z-index:0;pointer-events:none}
.lvx>*{position:relative;z-index:1}
@keyframes drift{to{transform:translate(4%,-3%) rotate(8deg) scale(1.08)}}
.lv-top{display:flex;align-items:center;gap:12px;padding:14px 22px;font-size:clamp(20px,2.2vw,30px)}
.lv-pill{background:rgba(255,255,255,.14);border-radius:999px;padding:4px 18px;font-size:clamp(18px,1.8vw,26px);white-space:nowrap}
.lv-pill:empty{display:none}
.lv-pill b{color:#ffd43b;font-weight:normal;font-size:1.2em}
.lv-btn{font-family:inherit;font-size:20px;border:0;border-radius:14px;padding:10px 22px;background:rgba(255,255,255,.92);color:#2b2140;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.35)}

{"t":"9주 내면 평가","q":"다음 문항들의 행동통제소(LCB) 채점 합계는?<span class=\"cs\">[LCB 일부 문항 · 0(전혀 아니다)~5(매우 그렇다)]<br>1. 나는 노력하면 말하기 어려움을 조절할 수 있다. → 4<br>2. 일이 잘 풀리는 것은 대부분 운이 좋아서이다. → 3<br>3. 원하는 결과는 내 행동으로 만들 수 있다. → 1<br>4. 말이 잘 되고 안 되고는 상대가 누구냐에 달려 있다. → 5<br>5. 나는 어려움을 미리 예상하고 대비할 수 있다. → 2</span>","o":["9점","15점","16점","19점","25점"],"a":2,"e":"내적(1·3·5) 5 − 응답: 1+4+3 / 외적(2·4) 그대로: 3+5 → 16<br><b>★ 외울 개념</b> LCB: 17문항 · 0~5점 · 내적 통제 문항 = 5 − 응답(역채점) · 총점↑ = 외적 통제소(부정적)","w":["내적·외적을 거꾸로 역채점함","역채점 없이 응답을 그대로 더함","","6 − 응답으로 뒤집음 (척도는 0~5)","5문항 × 5점 만점과 혼동"]},
{"t":"9주 내면 평가","q":"다음 대상자의 치료 전후 결과에 대한 해석으로 옳은 것은?<span class=\"cs\">[치료 전 → 6개월 후]<br>• S-24: 19점 → 13점<br>• PSI 회피: 16점 → 9점<br>• SESAS 접근: 38 → 66<br>• LCB: 61점 → 40점<br>• OASES 영향력: 66.0 → 48.0</span>","o":["S-24 감소는 의사소통 태도가 나빠졌음을 뜻한다.","PSI 회피 감소는 예기 반응이 늘었음을 뜻한다.","LCB 감소는 외적 통제소가 강해졌음을 뜻한다.","OASES 48.0은 경도–중등도 수준이다.","SESAS 접근 증가는 말하기 상황에 들어갈 자신감이 커졌음을 뜻한다."],"a":4,"e":"SESAS만 높을수록 긍정적 · 접근 = 상황에 들어갈 자신감<br><b>★ 외울 개념</b> 높을수록 부정적 = S-24·CAT·PSI·LCB·OASES / 높을수록 긍정적 = SESAS (유일한 예외)","w":["S-24는 높을수록 부정적 → 감소 = 태도 개선","회피(A) 점수↓ = 회피 감소 · 예기(E)는 별도 척도","LCB↓ = 내적 통제소 방향 (좋아짐)","45.0~59.9 = 중등도",""]},
{"t":"9주 내면 평가","q":"[14회 기출 47번] 다음 대상자에게 적절한 초기 치료 활동 내용은?<span class=\"cs\"><table class=\"ct\"><tr><th>영역</th><th>내용</th></tr><tr><td>핵심행동</td><td>읽기 %SS: 15 %SS · 대화 %SS: 2 %SS<br>주 비유창성 유형: 단어부분반복</td></tr><tr><td>부수행동</td><td>말을 더듬을 것 같은 단어와 상황을 피한다고 함</td></tr><tr><td>감정·태도</td><td>자아효능감 점수: 35점<br>말더듬 문제에 대해 자신이 어쩔 수 없다고 생각함</td></tr></table></span>","o":["읽기 과제 훈련을 통한 말더듬 회피 감소","말 문제 인식 향상을 통한 예기행동 증가","다양한 말하기 상황에 대한 접근 점수 감소","말하기 시도 증가를 통한 전형적 비유창성 감소","의사소통에 대한 자신감 증가를 통한 수행 점수 감소"],"a":0,"e":"읽기 15 ≫ 대화 2 %SS + 회피 = 숨은 말더듬 → 단어를 바꿀 수 없는 읽기로 회피를 줄이고 직면부터<br><b>★ 외울 개념</b> 대화 %SS가 낮은 건 유창해서가 아니라 회피 때문 · 숨은 말더듬은 회피 감소·직면부터 · SESAS 접근·수행 점수는 높아져야 좋음","w":["","예기행동은 줄여야 함","SESAS 접근 점수는 높여야 함","회피가 줄면 비유창성은 오히려 드러남","자신감↑ = 효능감 점수 증가"]},
{"t":"11주 아동 치료","q":"다음 분석에서 아동에게 부담이 되는 요인만 고른 것은?<span class=\"cs\">[어머니–아동 놀이 20분 분석]<br>• 어머니 말속도: 252 SPM<br>• 어머니 문장 20개 중 질문 6개<br>• 비평·교정 4개<br>• 아동 말에 반응한 문장 12개<br>• 아동 문장 8개 중 끼어들기 1회<br>• 대화 전환 시간: 평균 1.4초</span>","o":["질문, 비평","말속도, 질문, 끼어들기","말속도, 반응, 전환 시간","비평, 끼어들기, 전환 시간","질문, 반응, 끼어들기"],"a":1,"e":"252 SPM(&gt;220) · 질문 30 %(≥25) · 끼어들기 1 ÷ 8 = 12.5 %(≥10)<br><b>★ 외울 개념</b> 부담 기준: 말속도 180~220 SPM 초과 · 전환 1초 미만 · 끼어들기 10 %↑ · 질문 25 %↑ · 비평 50 %↑ · 반응 50 % 미만","w":["비평 4 ÷ 20 = 20 % &lt; 50 % → 부담 아님","","반응 60 %(≥50) · 전환 1.4초(≥1) → 괜찮음","비평·전환 시간은 기준 이내","반응 12 ÷ 20 = 60 % → 충분함"]},
{"t":"11주 아동 치료","q":"다음 아동에게 우선 적용할 중재로 적절한 것은?<span class=\"cs\">• 연령: 3세 8개월<br>• 말더듬 시작: 4개월 전<br>• 주 비유창성: 단어부분 반복, 연장 (막힘 없음)<br>• 자기 말더듬을 의식하지 않고 말하기를 좋아함<br>• 부수행동·회피 없음<br>• 어머니: “답답해서 자꾸 질문으로 재촉해요.”</span>","o":["부모에게 말속도 늦추기와 질문 줄이기를 지도한다.","아동이 자신의 말더듬 순간을 찾아내도록 지도한다.","의도적 말더듬으로 둔감화를 실시한다.","조절유창성을 목표로 연장 발화를 훈련한다.","6개월간 아무 중재 없이 자연회복을 기다린다."],"a":0,"e":"인식·2차 행동 없음 → 간접치료(환경 조정)<br><b>★ 외울 개념</b> 간접치료 대상: 인식 없음 · 2차 행동 없음 · 스트레스 없음(경계선급까지) / 6주 진전 없으면 직접치료로 전환","w":["","인식 없는 아동에게 말더듬 인식 유도 X","둔감화 = 직접치료 · 공포 없는 아동에게 불필요","아동의 치료 목표는 자발유창성","지켜보는 동안에도 부모 상담·환경 조정은 한다"]},
{"t":"11주 아동 치료","q":"심한 경계선급 아동의 직접치료 활동을 진행 순서대로 나열한 것은?<span class=\"cs\">(가) 아동이 치료사의 인위적인 말더듬을 찾아낸다.<br>(나) 치료사가 느리고 편하게 더듬는 모습을 보여 준다.<br>(다) 아동이 “내가 일부러 더듬어 볼게.”라며 더듬어 본다.<br>(라) 아동이 자기 말더듬을 쉽고 느리게 바꾼다.<br>(마) 아동의 비유창성을 재미있게 흉내 내는 놀이를 한다.</span>","o":["(가) → (나) → (마) → (다) → (라)","(나) → (가) → (다) → (마) → (라)","(나) → (마) → (가) → (다) → (라)","(나) → (가) → (마) → (다) → (라)","(마) → (나) → (가) → (다) → (라)"],"a":3,"e":"쉬운 말더듬 모델 → 나 잡아봐라 → 말더듬 놀이 → 의도적 말더듬 → 자신의 말더듬 변화<br><b>★ 외울 개념</b> 직접치료(원리 = 둔감화): 쉬운 말더듬 모델 → 나 잡아봐라 → 말더듬 놀이 → 의도적 말더듬 → 자신의 말더듬 변화","w":["쉬운 말더듬 모델(나)이 출발점","말더듬 놀이(마)가 의도적 말더듬(다)보다 먼저","찾아내기(가)가 말더듬 놀이(마)보다 먼저","","놀이로 시작하지 않음 · 모델 제공이 먼저"]},
{"t":"11주 아동 치료","q":"경계선급 말더듬 아동의 가족에게 줄 간접치료 지도 내용으로 옳은 것은?","o":["다섯 가지 가정 과제를 첫 회기에 한꺼번에 준다.","회기 피드백은 칭찬 1 : 수정 5의 비율로 한다.","매일 15~20분 아동과 듣는 시간을 갖고, 그동안 제안·지시를 삼간다.","아동이 말을 마치면 쉬지 말고 곧바로 대답해 준다.","첫 회기 후 좋아졌다가 다시 심해지면 치료 실패로 본다."],"a":2,"e":"‘듣는 연습’ 과제 그대로<br><b>★ 외울 개념</b> 가정 5가지: 듣는 연습(15~20분) · 느린 말속도 · 쉼(1~2초) · 긍정적 반응 · 질문 줄이기 / 칭찬 : 수정 = 5 : 1","w":["1~2개씩 과제로 · 부모가 수용·참여 단계인지 먼저 확인","칭찬 5 : 수정 1","","아동이 말하기 전 최소 1~2초 쉼","재발은 예상된 과정 · 미리 알려 둔다"]},
{"t":"12주 아동 프로그램","q":"다음 아동에 대한 치료 결정으로 가장 적절한 것은?<span class=\"cs\">• 연령: 4세 2개월<br>• 말더듬 시작: 14개월 전<br>• 아버지에게 말더듬 가족력<br>• P-FA-Ⅱ 말더듬 정도: 91 %ile<br>• 자기 말더듬을 의식하지 않음, 부수행동 없음<br>• 어머니가 매일 가정 연습 가능</span>","o":["91 %ile은 또래보다 유창한 수준이므로 관찰만 한다.","자연회복 가능성이 높으므로 6개월 뒤 재평가한다.","MIDVAS의 확인 단계부터 말더듬 수정법을 적용한다.","GILCU 확립 1단계 읽기 과제부터 시작한다.","부모가 수행하는 리드콤 프로그램을 적용한다."],"a":4,"e":"학령전기 · 인식 없음 · 부모 매일 참여 가능 → 리드콤 1순위<br><b>★ 외울 개념</b> 유창성 검사 백분위↑ = 심함 / 12개월↑ · 가족력 · 진성↑ → 치료 시작 / 학령전 · 부모 참여 · 인식 없음 → 리드콤","w":["유창성 검사 %ile↑ = 비유창성↑ = 심함","12개월↑ 지속 · 가족력 · 심함 → 지금 시작","인식 없음 → 수정법(확인 단계)은 이르다","1~18단계 = 읽기 · 학령전기는 그대로 못 씀",""]},
{"t":"12주 아동 프로그램","q":"리드콤 프로그램에서 어머니의 반응으로 적절하지 않은 것은?","o":["(유창하게 말한 뒤) “방금 아주 부드러웠어!”","(유창하게 말한 뒤) “방금 말, 부드러웠니?”","(분명하게 더듬은 뒤) “다시 부드럽게 말해 볼까?”","(애매한 비유창성 뒤) “지금 조금 울퉁불퉁했지?”","(분명하게 더듬은 뒤) “그건 조금 울퉁불퉁했네.”"],"a":3,"e":"애매한 비유창성에는 반응하지 않는다<br><b>★ 외울 개념</b> 리드콤: 유창 → 칭찬 · 자기평가 요청 · 인정 / 분명한 말더듬 → 인정 · 자기수정 요청 / 부모가 매일 SR(0~9) 평정","w":["칭찬하기 = 유창한 말에 대한 반응 (적절)","자기평가 요청 = 유창한 말에 대한 반응 (적절)","자기수정 요청 = 분명한 말더듬에 대한 반응 (적절)","","인정하기 = 중립적으로 (적절)"]},
{"t":"12주 아동 프로그램","q":"GILCU에 대한 설명으로 옳은 것은?","o":["확립 단계는 대화 → 독백 → 읽기 순으로 진행한다.","확립은 54단계이며 같은 사다리를 세 양식에서 반복한다.","비유창성이 나오면 곧바로 1단계로 되돌린다.","부모가 매일 아동의 중증도를 SR로 평정한다.","확립과 전이가 끝나면 유지 단계 없이 종결한다."],"a":1,"e":"낱말 → 문장 → 시간(30초~5분)을 읽기·독백·대화에서 반복<br><b>★ 외울 개념</b> GILCU(Ryan): 발화 길이·복잡성 점진 증가 · 확립 54단계(읽기 1~18 · 독백 19~36 · 대화 37~54) · 유창한 말 강화","w":["읽기(1~18) → 독백(19~36) → 대화(37~54)","","분지 단계: 지시 · 시범 후 본 프로그램으로 복귀","부모 SR 평정 = 리드콤의 특징","유지 5단계 · 약 22개월에 걸쳐 간격을 늘림"]},
{"t":"12주 아동 프로그램","q":"다음 평가 결과를 바탕으로 치료를 시작할 질문 유형은?<span class=\"cs\">[스토커 프로브 평가 · 물건: 사과]<br>수준 1 “빨간색이에요, 초록색이에요?” → 유창<br>수준 2 “이것은 무엇인가요?” → 유창<br>수준 3 “이것은 어디에서 볼 수 있나요?” → 유창<br>수준 4 “이것에 대해서 설명해 주세요.” → 비유창</span>","o":["양자택일 질문","의문사 질문","‘~에서’ 반응을 유도하는 질문","물건의 특성을 설명하게 하는 질문","자신의 경험을 이야기하게 하는 질문"],"a":2,"e":"수준 4에서 무너짐 → 한 수준 아래(수준 3)에서 시작<br><b>★ 외울 개념</b> 스토커 요구 수준: 양자택일 → 의문사 → ‘~에서’ → 특성 설명 → 경험 이야기 · 무너지는 수준 한 단계 아래에서 시작","w":["수준 1 · 이미 충분히 유창","수준 2 · 무너지는 지점보다 두 단계 아래","","수준 4 = 비유창이 시작된 수준","수준 5 = 가장 높은 요구 수준"]},

${items.map(k=>{const q=Q[k],r=S.a[k];return `<div class="wi"><b>${k+1}.</b> ${q.q}<div class="an">${r?`<span class="my">내 답 ${esc(optTxt(q,r[0]))}</span>`:'<span class="my">못 푼 문제</span>'}<span class="co">정답 ${esc(optTxt(q,q.a))}</span>${S.r[k]===1?'<span class="rt">🔁 재도전 성공</span>':S.r[k]===0?'<span class="rt">🔁 재도전 오답</span>':''}</div>${q.w&&r&&r[0]>=0&&q.w[r[0]]?`<div class="ex" style="color:#c2334f">✕ 내가 고른 답: ${q.w[r[0]]}</div>`:''}<div class="ex">💡 ${q.e||''}</div></div>`}).join('')}</div></div>`}).join('')
  :'<div class="res">🎊 틀린 문제가 없어요! 완벽해요.</div>')+`</div></div>`;

function countUp(root){root.querySelectorAll('[data-to]').forEach(el=>{const to=+el.dataset.to,t0=performance.now(),sm=el.querySelector('small'),sh=sm?sm.outerHTML:'';

<p class="sub">${esc(SUBJECT)} · 총 ${Q.length}문제 · ${PL.length}개 파트${LIMIT?' · ⏱ 제한시간 '+Math.round(LIMIT/60)+'분':''}<br>선생님이 <b>라이브로 진행</b>해요 · 끝나면 <b>나만의 파트별 학습 리포트</b>가 나와요 📊</p>
<div class="center"><div id="resume"></div><div class="fld" style="display:grid;gap:10px;justify-items:center"><input class="inp" id="no" maxlength="12" placeholder="학번${NEED_NO?'':' (선택)'}" inputmode="numeric" autocomplete="off"><input class="inp" id="nm" maxlength="12" placeholder="이름" autocomplete="off"></div>

async function offerResume(){const ss=LS.get('sess');if(!ss||!ss.key||mode!=='home')return;
let g=null;try{g=await rpc('quiz_get',{p_id:ss.key})}catch(e){return}
if(!g){LS.del('sess');return}
if(g.round!==g.current)return;
const rec=g.data;if(!rec||mode!=='home'||!$('#resume'))return;if(!rec.d&&!rec.lv)return;
$('#resume').innerHTML=`<button class="btn alt" id="rs">${rec.d?'📊 '+esc(rec.n)+' 리포트 다시 보기':'▶ '+esc(rec.n)+' 이어서 풀기'}</button><p class="hint" style="margin:10px 0 18px">다른 사람으로 새로 시작하려면 아래에 입력하세요</p>`;
$('#rs').onclick=async()=>{myKey=ss.key;me=rec;me.a=me.a||{};score=me.s||0;
  if(me.d){i=Q.length;end();return}
  if(me.lv){const L=await liveCheck();if(L&&L.id===me.lv){liveStart();return}finishLive();return}
  i=0;while(i<Q.length&&me.a[i])i++;
  mode='play';if(left()<=0){timeUp();return}startTimer();i<Q.length?show():end()}}

async function join(){const n=$('#nm').value.trim(),no=$('#no').value.trim();
if(!n){$('#msg').textContent='이름을 입력해 주세요!';$('#nm').focus();return}
if(NEED_NO&&!no){$('#msg').textContent='학번을 입력해 주세요!';$('#no').focus();return}
$('#go').disabled=true;$('#msg').textContent='입장 중... 🚪';$('#solo').innerHTML='';
i=0;score=0;const now=Date.now();me={n,no,a:{},s:0,c:0,d:false,st:now,f:0,t:now};
let LV0=await liveCheck();
if(!LV0){$('#msg').innerHTML='⏳ 아직 라이브가 시작되지 않았어요.<br>선생님이 시작하면 <b>자동으로 입장</b>돼요. 이 화면을 그대로 두세요!';
  while(!LV0){await new Promise(r=>setTimeout(r,2000));if(mode!=='home'||!$('#go'))return;LV0=await liveCheck()}}
me.lv=LV0.id;me.st=Date.now();
try{const id=now.toString(36)+Math.random().toString(36).slice(2,9);
  const round=await rpc('quiz_join',{p_quiz:QUIZ,p_id:id,p_data:me});
  myKey=id;LS.set('sess',{key:id,round:Number(round)});
}catch(e){myKey='';$('#go').disabled=false;
  $('#msg').textContent='⚠️ 선생님 화면과 연결하지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
  return}
liveStart()}

function qCard(d,k,head,btn){return `${head}
<div class="card"><div class="row"><span class="tag" style="background:${pcol(d.t)};color:#fff">${EM[k%4]} ${esc(d.t)}</span><span class="tag" style="background:var(--yel)">🙋 ${esc(me?me.n:'')}${myKey?'':' (혼자)'}</span></div><div class="q">${d.q}</div>
<div class="opts ${d.ox?'ox':''}">${d.o.map((x,j)=>`<button class="opt" data-k="${j}"><span class="n">${d.ox?(j?'✖':'⭕'):j+1}</span>${d.ox?'':x}</button>`).join('')}</div>
<div class="fb" id="fb"></div><div class="next" id="nx"><button class="btn" id="nb">${btn}</button></div></div>`}
function show(){locked=false;app.className='wrap';const d=Q[i];if(me&&myKey){me.c=i;save()}qT0=Date.now();
app.innerHTML=qCard(d,i,`<div class="top"><span>${i+1}/${Q.length}</span><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><span class="score">⭐ ${score}</span>${LIMIT?`<span class="score tmr" id="tm">⏱ ${mmss(left())}</span>`:''}</div>`,i==Q.length-1?'리포트 보기 📊':'다음 문제 ▶');
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));$('#nb').onclick=next}
function mark(d,k){const bs=document.querySelectorAll('.opt');bs.forEach((b,n)=>{b.disabled=true;if(n===d.a)b.classList.add('right');else if(n===k)b.classList.add('wrong');else b.classList.add('dim')})}
function pick(k){if(locked||left()<=0)return;if(mode==='retry')return rpick(k);locked=true;const d=Q[i],ok=k===d.a;mark(d,k);
if(ok){score++;confetti()}
if(me){me.a[i]=[k,ok?1:0,Math.min(Date.now()-qT0,600000)];me.s=score;save()}
const f=$('#fb');f.innerHTML=(ok?'<b>🎉 정답!</b> ':'<b>🥲 아쉬워요!</b> ')+(d.e||'');f.classList.add('show');$('#nx').classList.add('show');$('.score').textContent='⭐ '+score}
function next(){if(mode==='retry')return rnext();if(me&&me.d)return;i++;i<Q.length?show():end()}

/* 틀린 문제 재도전 */
function retry(){rList=st(me).wrong;rI=0;if(!rList.length)return;mode='retry';rshow()}
function rshow(){locked=false;const k=rList[rI],d=Q[k];
app.innerHTML=qCard(d,k,`<div class="top"><span>🔁 재도전 ${rI+1}/${rList.length}</span><div class="bar"><i style="width:${rI/rList.length*100}%"></i></div><span class="score">원래 ${k+1}번</span></div>`,rI==rList.length-1?'리포트로 돌아가기 📊':'다음 문제 ▶');
document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));$('#nb').onclick=next}
function rpick(k){if(locked)return;locked=true;const q=rList[rI],d=Q[q],ok=k===d.a;mark(d,k);if(ok)confetti();
me.r=me.r||{};me.r[q]=ok?1:0;save();
const f=$('#fb');f.innerHTML=(ok?'<b>💪 이번엔 정답!</b> ':'<b>🧐 한 번 더 확인해요.</b> ')+(d.e||'');f.classList.add('show');$('#nx').classList.add('show')}
function rnext(){rI++;if(rI<rList.length)rshow();else{mode='play';end()}}

const W=st(me||{}).wrong.length,R=me&&me.r?Object.keys(me.r).length:0;
app.innerHTML=`${tu}<div class="anim">${report(me||{a:{},s:0,n:''},all)}</div>
<div class="acts">${W?`<button class="btn" id="rt" style="background:var(--pink2)">🔁 틀린 문제 다시 도전 (${W})</button>`:''}${myKey?`<button class="btn alt" id="rf">🔄 반 비교 새로고침</button>`:''}<button class="btn alt" id="pr">🖨 리포트 저장(PDF)</button><button class="btn" id="re">처음으로 🏠</button></div>
${P&&cstat(all)&&cstat(all).n<2?'<p class="hint">반 친구들이 더 끝내면 \'반 비교 새로고침\'으로 반 평균과 비교할 수 있어요.</p>':''}`;
countUp(app);
$('#re').onclick=home;$('#pr').onclick=()=>printView([me],all);if($('#rt'))$('#rt').onclick=retry;if($('#rf'))$('#rf').onclick=end;

function confetti(){const c=['🎉','⭐','🌸','🍬','💖','✨'];for(let n=0;n<14;n++){const s=document.createElement('span');s.className='conf';s.textContent=c[n%c.length];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),2200)}}

document.addEventListener('keydown',e=>{if((mode!=='play'&&mode!=='retry')||e.target.tagName==='INPUT')return;const nx=$('#nx');

function snd(t){if(!blSnd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const T=AC.currentTime;
  const tone=(f,s,d,g,w)=>{const o=AC.createOscillator(),v=AC.createGain();o.type=w||'sine';o.frequency.value=f;v.gain.setValueAtTime(g||.18,T+s);v.gain.exponentialRampToValueAtTime(.0001,T+s+d);o.connect(v);v.connect(AC.destination);o.start(T+s);o.stop(T+s+d+.03)};
  if(t==='tick')tone(1250,0,.07,.13,'square');else if(t==='cnt')tone(660,0,.18,.16,'triangle');else if(t==='go')[523,659,784,1047].forEach((f,j)=>tone(f,j*.07,.28,.15,'triangle'));
  else if(t==='end')[392,262].forEach((f,j)=>tone(f,j*.18,.45,.2,'sawtooth'));else if(t==='rev')[784,988,1175,1568].forEach((f,j)=>tone(f,j*.09,.4,.14,'triangle'));else if(t==='join')tone(988,0,.12,.1,'sine')}catch(e){}}

    o.innerHTML=blTop(`Q ${k+1} / ${Q.length} · 정답 공개`)+`<div class="lv-qwrap" style="flex:none"><div class="lv-q sm">${d.q}</div></div>
<div class="lv-opts rv ${d.ox?'ox':''} ${d.o.length>4?'o5':''}">${d.o.map((x,j)=>`<div class="lv-opt c${j%5} ${j===d.a?'ok':'dim'}"><span class="sh">${j===d.a?'✔':(d.ox?(j?'✖':'⭕'):SH[j%5])}</span><span class="tx">${d.ox?(j?'X':'O'):x}</span><span class="cnt" id="lvc${j}">0명</span><i class="fill" id="lvb${j}"></i></div>`).join('')}</div>
<div class="lv-rstat"><div><span>✅ 정답률</span><b id="lvr1">-</b></div><div><span>⏱ 평균 반응</span><b id="lvr2">-</b></div><div><span>⚡ 빠르고 정확</span><b id="lvr3">-</b></div><div class="lv-exp">💡 ${d.e||''}</div></div>
<div class="lv-foot"><span style="flex:1"></span><button class="lv-btn" id="lvstop">⏹ 여기서 끝내기</button><button class="lv-btn go xl" id="lvnext">${k<Q.length-1?'다음 문제 ▶':'🏁 결과 보기'}</button></div>`;
    $('#lvnext').onclick=()=>k<Q.length-1?blGo(k+1):blEnd();$('#lvstop').onclick=blEnd;revealFill()}
  else if(ph==='end')blEndView();
  blBind();blUpdate()}
async function blGo(k){const b=$('#lvgo')||$('#lvnext');if(b)b.disabled=true;try{BL=await liveSet({phase:'q',idx:k,sec:blSec,id:BL.id,lead:3000},true)}catch(e){alert('시작하지 못했어요: '+e.message);if(b)b.disabled=false;return}boardRender()}
async function blReveal(){if(!BL||BL.phase!=='q')return;cancelAnimationFrame(blRaf);BL={...BL,phase:'reveal'};snd('end');setTimeout(()=>snd('rev'),450);
  liveSet(BL).catch(()=>{});boardRender();setTimeout(async()=>{await blRefresh();if(BL.phase==='reveal')revealFill()},1100)}
function revealFill(){if(!BL||BL.phase!=='reveal')return;const k=BL.idx,d=Q[k],R=blPl().map(p=>p.a&&p.a[k]).filter(r=>r&&r[0]>=0),cnt=d.o.map(()=>0);R.forEach(r=>{if(cnt[r[0]]!=null)cnt[r[0]]++});const mx=Math.max(1,...cnt);
  cnt.forEach((c,j)=>{const b=$('#lvb'+j),t=$('#lvc'+j);if(b)b.style.width=(c/mx*100)+'%';if(t)t.textContent=c+'명'});
  const ok=R.filter(r=>r[1]).length,av=R.length?R.reduce((a,r)=>a+r[2],0)/R.length/1000:0,su=R.filter(r=>spdOf(r)==='sure').length;
  if($('#lvr1')){$('#lvr1').textContent=R.length?Math.round(ok/R.length*100)+'%':'-';$('#lvr2').textContent=R.length?av.toFixed(1)+'초':'-';$('#lvr3').textContent=su+'명'}}
function blUpdate(){if(!BL||!boardOn)return;const P=blPl(),c=$('#lvcnt');
  if(BL.phase==='lobby'){const nm=$('#lvnames');if(nm){$('#lvn').textContent=P.length;const have=new Set([...nm.children].map(x=>x.dataset.id));
      P.forEach(p=>{if(!have.has(p.id)){const s=document.createElement('span');s.dataset.id=p.id;s.textContent=p.n;s.style.background=PCOL[nm.children.length%PCOL.length];nm.appendChild(s);snd('join')}})}
    if(c)c.textContent='👥 '+P.length+'명';return}
  if(BL.phase==='q'||BL.phase==='reveal'){const k=BL.idx,ans=P.filter(p=>p.a&&p.a[k]&&p.a[k][0]>=0).length;if(c)c.innerHTML=`🙋 응답 <b>${ans}</b> / ${P.length}`;
    if(BL.phase==='q'&&blAuto&&P.length&&ans>=P.length&&snow()>BL.t0+800)blReveal();
    if(BL.phase==='reveal')revealFill()}}
async function blEnd(){BL={...BL,phase:'end'};try{await liveSet(BL)}catch(e){}snd('rev');await blRefresh();boardRender()}
function blEndView(){const o=$('#lv');if(BL.idx>=0&&BL.idx+1<Q.length){Q.splice(BL.idx+1);PL=[...new Set(Q.map(q=>q.t))];tSig=''}const P=blPl().map(p=>({...p,d:true})),cls=cstat(P);
  if(!cls){o.innerHTML=blTop('🏁 라이브 종료')+'<div class="lv-mid"><div class="lv-panel">참여한 학생이 없어요.<div class="lv-row"><button class="lv-btn go" id="lvdb">📊 대시보드로</button></div></div></div>';blBind();$('#lvdb').onclick=boardClose;return}
  const PS=PL.map((t,j)=>{const c={sure:0,slow:0,rash:0,need:0};let n=0;P.forEach(p=>Q.forEach((q,k)=>{if(q.t!==t)return;n++;c[spdOf(p.a&&p.a[k])||'need']++}));return{t,c,n,sr:n?Math.round(c.sure/n*100):0,pc:cls.part[t]}});
  const sure=PS.filter(x=>x.sr>=50).sort((a,b)=>b.sr-a.sr),weak=[...PS].sort((a,b)=>a.pc-b.pc).filter(x=>x.pc<70);
  const all=P.flatMap(p=>Q.map((_,k)=>p.a&&p.a[k]).filter(r=>r&&r[0]>=0)),avT=all.length?all.reduce((a,r)=>a+r[2],0)/all.length/1000:0,suAll=all.filter(r=>spdOf(r)==='sure').length;
  o.innerHTML=blTop('🏁 라이브 결과')+`<div class="lv-end"><h1>🎉 모두 수고하셨어요!</h1><p style="text-align:center;font-size:20px;opacity:.85;margin:0">개인 리포트는 각자 휴대폰에 도착했어요 📱</p>
<div class="lv-kp"><div>👥 참여<b>${P.length}명</b></div><div>✅ 반 평균 정답률<b>${Math.round(cls.avg/Q.length*100)}%</b></div><div>⚡ 빠르고 정확한 응답<b>${all.length?Math.round(suAll/all.length*100):0}%</b><small>평균 반응 ${avT.toFixed(1)}초</small></div></div>
<h2 style="margin:10px 0 4px">🧩 파트별 반 전체 확실도</h2>${PS.map((x,j)=>`<div class="lv-prt"><span>${esc(x.t)}</span><div class="lv-stk">${CK.map(c=>x.c[c]?`<i style="width:${x.c[c]/x.n*100}%;background:${CT[c][3]};animation-delay:${j*.12}s" title="${CT[c][1]}"></i>`:'').join('')}</div><span>⚡ ${x.sr}% · ✅ ${x.pc}%</span></div>`).join('')}
<div class="lg" style="color:#fff;font-size:18px">${CK.map(c=>`<span><i style="background:${CT[c][3]}"></i>${CT[c][0]} ${CT[c][1]}</span>`).join('')}</div>
<div class="lv-call"><div style="background:rgba(47,184,121,.25)">⚡ <b>반 전체가 확실히 아는 파트</b><br>${sure.length?sure.slice(0,3).map(x=>esc(x.t)+' ('+x.sr+'%)').join(' · '):'아직 없어요. 함께 다져 봐요!'}</div><div style="background:rgba(240,80,110,.25)">🔥 <b>다시 짚어 볼 파트</b><br>${weak.length?weak.slice(0,3).map(x=>esc(x.t)+' (정답률 '+x.pc+'%)').join(' · '):'모든 파트 70% 이상! 훌륭해요 🎊'}</div></div>
<div class="lv-row" style="margin-top:22px"><button class="lv-btn go xl" id="lvdb">📊 자세한 분석 대시보드</button></div></div>`;
  blBind();$('#lvdb').onclick=boardClose;for(let n=0;n<4;n++)setTimeout(confetti,n*300)}

 if(er.length){console.warn(er);const d=document.createElement('div');d.className='timeup';d.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:99;font-size:16px';d.textContent='⚠️ 문제 확인 필요: '+er.join(' / ');document.body.appendChild(d)}})();
