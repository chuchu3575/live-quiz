<style>
:root{--pink:#ffd6e0;--pink2:#ff8fab;--mint:#d4f5e4;--mint2:#4cc38a;--yel:#fff3bf;--yel2:#f7b731;--sky:#d6ecff;--ink:#4a3b52;--bg:#fff8f0;--card:#fff;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background-image:radial-gradient(var(--pink) 2px,transparent 2px),radial-gradient(var(--sky) 2px,transparent 2px);background-size:36px 36px;background-position:0 0,18px 18px}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 40px}
.wrap.wide{max-width:1240px}
.card{background:var(--card);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:26px 24px}
h1{margin:0;font-size:clamp(30px,6vw,52px);text-align:center;line-height:1.25}
h2{font-size:clamp(22px,3.4vw,30px)}h3{margin:22px 0 10px;font-size:22px;font-weight:normal}
.mascot{font-size:clamp(70px,14vw,120px);text-align:center;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.sub{text-align:center;font-size:clamp(18px,3vw,24px);margin:8px 0 22px}
.btn{font-family:inherit;font-size:clamp(20px,3.4vw,28px);background:var(--yel2);color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:.08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.6;cursor:default}
.btn.sm{font-size:18px;padding:6px 16px;border-width:3px;box-shadow:0 4px 0 var(--ink)}
.btn.alt{background:var(--sky)}.btn.red{background:var(--pink2)}
.center{text-align:center}
.inp{font-family:inherit;font-size:26px;color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:10px 16px;width:100%;max-width:380px;text-align:center;outline:none}
.inp:focus{background:var(--yel)}
.link{background:none;border:none;font-family:inherit;color:var(--ink);opacity:.55;text-decoration:underline;cursor:pointer;font-size:16px;margin-top:22px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:clamp(18px,3vw,24px)}
.bar{flex:1;height:22px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink2),var(--yel2));transition:width .4s}
.score{background:var(--yel);border:3px solid var(--ink);border-radius:999px;padding:2px 14px}
.tag{display:inline-block;background:var(--sky);border:3px solid var(--ink);border-radius:999px;padding:2px 14px;font-size:clamp(15px,2.4vw,20px);margin-bottom:10px}
.q{font-size:clamp(24px,4.4vw,38px);line-height:1.4;margin:6px 0 20px;word-break:keep-all}
.opts{display:grid;gap:14px}
.opt{font-family:inherit;text-align:left;font-size:clamp(20px,3.4vw,30px);line-height:1.35;color:var(--ink);background:var(--pink);border:4px solid var(--ink);border-radius:22px;padding:14px 18px;cursor:pointer;box-shadow:0 6px 0 var(--ink);display:flex;gap:14px;align-items:center;word-break:keep-all;transition:.08s}
.opt:nth-child(2){background:var(--mint)}.opt:nth-child(3){background:var(--yel)}.opt:nth-child(4){background:var(--sky)}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.opt .n{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:26px}
.opt:disabled{cursor:default}
.opt.right{background:var(--mint2)!important;animation:pop .5s}
.opt.wrong{background:var(--bad)!important;animation:shake .4s;color:#fff}
.opt.dim{opacity:.45}
.ox{grid-template-columns:1fr 1fr}.ox .opt{justify-content:center;font-size:clamp(34px,7vw,64px);padding:22px}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin-top:20px;border:4px dashed var(--ink);border-radius:22px;padding:14px 18px;background:#fffdf5;font-size:clamp(18px,3vw,26px);line-height:1.5;display:none;word-break:keep-all}
.fb.show{display:block;animation:pop .4s}
.fb b{font-size:1.15em}
.next{margin-top:20px;display:none;text-align:right}.next.show{display:block}
.hint{text-align:center;margin-top:16px;font-size:16px;opacity:.7}
.big{font-size:clamp(54px,12vw,110px);text-align:center;line-height:1.1}
.res{font-size:clamp(22px,4vw,34px);text-align:center;margin:10px 0 20px}
.wrongs{margin:16px 0 0;padding:0;list-style:none;font-size:clamp(16px,2.6vw,22px);text-align:left}
.wrongs li{background:var(--pink);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.conf{position:fixed;top:-20px;font-size:28px;pointer-events:none;animation:fall 1.6s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}

.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}

.qbars{display:grid;gap:6px}
.qb{display:grid;grid-template-columns:48px 1fr 110px;gap:10px;align-items:center;cursor:pointer;font-size:18px;padding:3px 8px;border-radius:12px}

.dr{display:grid;grid-template-columns:1fr minmax(100px,220px) 54px;gap:10px;align-items:center;margin-top:8px;font-size:.85em}
.dr.ok{color:#1e7a4f}.dr .bar{height:16px}.dr.ok .bar>i{background:var(--mint2)}
.tbl{overflow:auto;max-height:62vh;border:3px solid var(--ink);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{border:1.5px solid #c9bfd0;padding:5px 6px;text-align:center}
th{background:var(--sky);position:sticky;top:0;z-index:1}
td.nm{text-align:left;white-space:nowrap}
td.c-ok{background:var(--mint)}td.c-no{background:#ffd3d3}
.wait{font-size:22px;padding:30px 10px}
.live{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--mint2);margin-right:6px;animation:blink 1s infinite;vertical-align:middle}
@keyframes blink{50%{opacity:.2}}
.ov{position:fixed;inset:0;background:rgba(74,59,82,.6);display:grid;place-items:center;z-index:20;padding:16px}
.ov .card{max-width:760px;width:100%;text-align:center;max-height:96vh;overflow:auto}
#qr{display:inline-block;background:#fff;padding:16px;border:4px solid var(--ink);border-radius:20px;margin:14px 0}
#qr img,#qr canvas{display:block;width:min(58vh,70vw);height:auto}
td.tm{white-space:nowrap;font-size:15px}
.tmr{white-space:nowrap}.tmr.low{background:var(--bad);color:#fff;animation:blink 1s infinite}
.timeup{background:var(--bad);color:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-size:clamp(20px,3.6vw,30px);text-align:center;margin:0 0 12px}
/* ================= 리포트 v2 ================= */
:root{--okc:#2fb879;--midc:#f59f00;--lowc:#f0506e}
.wrap.rpw{max-width:1040px}
.rp{text-align:left}
.sec{background:#fff;border:3px solid var(--ink);border-radius:26px;padding:20px 22px;margin:18px 0;box-shadow:0 6px 0 var(--ink);position:relative}
.sec h3{margin:0;font-size:clamp(21px,3vw,27px);display:flex;align-items:center;gap:10px}
.sec h3 .no{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-size:17px;flex:none}

.hero .who{font-size:16px;opacity:.65}.hero h2{margin:2px 0 10px;font-size:clamp(26px,4.4vw,40px);line-height:1.2}
.lvb{display:inline-flex;align-items:center;gap:8px;padding:4px 18px;border-radius:999px;border:3px solid var(--ink);background:#fff;font-size:clamp(18px,2.6vw,24px);box-shadow:0 4px 0 var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
.chip{border:2px solid var(--ink);border-radius:999px;padding:3px 13px;background:#fff;font-size:16px;white-space:nowrap}
.chip.hot{background:var(--ink);color:#fff}
.diag{margin-top:14px;font-size:clamp(17px,2.4vw,21px);line-height:1.65;word-break:keep-all;background:rgba(255,255,255,.75);border-radius:16px;padding:10px 14px;border:2px dashed var(--ink)}
.diag b{background:linear-gradient(transparent 58%,#ffe066 58%)}
.ringbox{position:relative;width:min(220px,46vw);aspect-ratio:1}
.ringbox svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.ringbox .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center;line-height:1}
.ringbox .ctr b{font-size:clamp(46px,9vw,72px);font-weight:normal}.ringbox .ctr b small{font-size:.4em}
.ringbox .ctr span{font-size:17px;opacity:.7;margin-top:6px}
.duo{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:center}
.duo svg{width:100%;height:auto;display:block;overflow:visible}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;margin-top:6px;justify-content:center}
.lg i{display:inline-block;width:22px;height:10px;border-radius:4px;margin-right:5px;vertical-align:middle}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.pcard{border:3px solid var(--ink);border-radius:20px;padding:16px 14px 12px;background:#fff;position:relative;overflow:hidden}
.pcard::before{content:'';position:absolute;left:0;top:0;right:0;height:9px;background:var(--pc)}
.pcard .ph{display:flex;align-items:center;gap:10px}
.pcard .ph svg{width:64px;height:64px;flex:none;transform:rotate(-90deg)}
.pcard .pn{font-size:19px;line-height:1.25;word-break:keep-all}.pcard .pn small{display:block;font-size:14px;opacity:.6}
.pcard .big{font-size:30px;line-height:1;text-align:left}
.lv{font-style:normal;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:14px;white-space:nowrap;display:inline-block}
.lv.good{background:#c8f2dc}.lv.mid{background:#ffeab0}.lv.low{background:#ffd0d8}
.dl{font-size:14px;margin-left:4px}.dl.up{color:#1e8a57}.dl.dn{color:#d6334f}
.qds{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.qd{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:13px;border:2px solid var(--ink)}
.qd.ok{background:#c8f2dc}.qd.no{background:#ffd0d8}.qd.na{background:#eee;opacity:.6}.qd.fx{background:linear-gradient(135deg,#ffd0d8 50%,#c8f2dc 50%)}
.mx{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:16px;align-items:center}
.mx svg{width:100%;height:auto;display:block}
.qlist{display:grid;gap:8px;font-size:16px;line-height:1.5}
.qlist div{border-left:6px solid var(--c);background:#faf7fc;border-radius:10px;padding:6px 10px;word-break:keep-all}
.jw{overflow-x:auto}.jw svg{display:block;min-width:560px;width:100%;height:auto}
.step{display:grid;grid-template-columns:72px 1fr;gap:14px;margin:14px 0;align-items:start}
.step .sn{background:var(--pc);border:3px solid var(--ink);border-radius:18px;text-align:center;padding:8px 0;font-size:14px;line-height:1.1;box-shadow:0 4px 0 var(--ink)}
.step .sn b{display:block;font-size:30px;font-weight:normal}
.step h4{margin:2px 0 6px;font-size:21px;font-weight:normal}
.gd{background:#f3fbff;border:2px solid #9fd2f5;border-radius:12px;padding:6px 12px;font-size:16px;margin:6px 0;line-height:1.5}
.wi{border:2px solid var(--ink);border-radius:14px;padding:8px 12px;margin:8px 0;background:#fffafb;font-size:clamp(15px,2.2vw,18px);line-height:1.55;word-break:keep-all}
.wi .an{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.wi .an span{border-radius:999px;padding:1px 10px;font-size:.88em;border:2px solid var(--ink)}
.wi .my{background:#ffd0d8}.wi .co{background:#c8f2dc}.wi .rt{background:#fff3bf}
.wi .ex{font-size:.92em;opacity:.85}
.acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:20px}
.loading{text-align:center;padding:60px 10px;font-size:24px}
.spin{display:inline-block;width:46px;height:46px;border:6px solid var(--pink);border-top-color:var(--ink);border-radius:50%;animation:sp 1s linear infinite;margin-bottom:12px}
@keyframes sp{to{transform:rotate(360deg)}}
/* 애니메이션 */
@keyframes ringd{from{stroke-dashoffset:var(--c)}}
@keyframes grow{from{transform:scale(0);opacity:0}}
@keyframes up{from{transform:translateY(16px);opacity:0}}
@keyframes barw{from{width:0}}
@keyframes bary{from{transform:scaleY(0)}}
@keyframes pin{from{opacity:0;transform:scale(0)}}
@keyframes dash{from{stroke-dashoffset:var(--l)}}
.anim .rg{animation:ringd 1.4s cubic-bezier(.2,.8,.2,1) both}
.anim .gr{animation:grow 1s cubic-bezier(.2,.9,.25,1.1) both}
.anim .sec{animation:up .6s ease both}
.anim .sec:nth-child(2){animation-delay:.08s}.anim .sec:nth-child(3){animation-delay:.16s}.anim .sec:nth-child(4){animation-delay:.24s}.anim .sec:nth-child(5){animation-delay:.32s}.anim .sec:nth-child(6){animation-delay:.4s}
.anim .bw{animation:barw 1.1s cubic-bezier(.2,.8,.2,1) both}
.anim .by{transform-box:fill-box;transform-origin:50% 100%;animation:bary .9s cubic-bezier(.2,.8,.2,1) both}
.anim .pi{transform-box:fill-box;transform-origin:center;animation:pin .5s cubic-bezier(.2,.9,.3,1.4) both}
.anim .ln{animation:dash 1.6s ease both}
/* 교사 분석 */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.tabs button{font-family:inherit;font-size:19px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 16px;cursor:pointer}
.tabs button.on{background:var(--ink);color:#fff;box-shadow:0 4px 0 var(--yel2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{border:3px solid var(--ink);border-radius:20px;padding:12px 14px;background:var(--kc,#fff)}
.kpi span{font-size:15px;opacity:.75}.kpi b{display:block;font-size:38px;font-weight:normal;line-height:1.15}.kpi small{font-size:14px;opacity:.7}
.g2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.focus li{margin:6px 0;line-height:1.5;word-break:keep-all}
.focus{margin:0;padding-left:22px;font-size:17px}
.live-ch{display:flex;flex-wrap:wrap;gap:8px}
.live-ch span{border:2px solid var(--ink);border-radius:12px;padding:3px 10px;font-size:15px;background:#fff;position:relative;overflow:hidden}
.live-ch span i{position:absolute;left:0;bottom:0;height:4px;background:var(--mint2)}
.strip{display:grid;grid-template-columns:minmax(90px,160px) 1fr 120px;gap:12px;align-items:center;margin:10px 0;font-size:17px}
.strip svg{width:100%;height:auto;display:block;overflow:visible}
.qrow{display:grid;grid-template-columns:52px minmax(0,1fr) 150px minmax(140px,220px) 74px 62px;gap:10px;align-items:center;padding:8px 6px;border-bottom:1.5px solid #e6dfeb;font-size:16px;cursor:pointer}
.qrow:hover{background:#fffbea}.qrow.hd{font-size:14px;opacity:.65;cursor:default;background:none}
.qrow .qt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stk{display:flex;height:20px;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.stk i{display:block;height:100%;font-style:normal;font-size:11px;color:#fff;text-align:center;line-height:16px;overflow:hidden}
.mini{height:14px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff}.mini i{display:block;height:100%}
.dc{border-radius:999px;padding:0 8px;font-size:13px;border:2px solid var(--ink);text-align:center}
.mcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mc{border:3px solid var(--ink);border-radius:18px;padding:12px 14px;background:#fff6f8;font-size:16px;line-height:1.5;word-break:keep-all}
.mc b.pct{font-size:34px;font-weight:normal;color:#d6334f;display:block;line-height:1.1}
.hm{border-collapse:separate;border-spacing:3px;font-size:14px}

 body{background:none!important}#app{display:none!important}
 .ov{position:static!important;background:none!important;display:block!important;padding:0!important}

<script>
/* =====================================================================
   춘해보건대학교 파트별 리포트 퀴즈 v2 - 설정 영역 (여기만 고치면 돼요)
   ===================================================================== */
const TITLE='춘해보건대학교<br>쑥쑥 퀴즈!';          // 첫 화면 제목
const SUBJECT='○○학과 · ○○과목 · ○주차';              // 첫 화면 부제 · 리포트 머리글
const MASCOT='🩺';
const LIMIT=0;                                          // 제한시간(초). 0이면 제한 없음 (예: 600 = 10분)
const QUIZ='chunhae';                                   // Supabase quiz_config.quiz 값 (바꾸려면 먼저 등록 필요)
const NEED_NO=false;                                    // true면 학번 입력을 필수로
const TEACHER_PW='ch9mub9g5y9q48nckiqte8t7';                      // 교사용 비밀번호(입력창 없이 자동 사용). 코드에 들어 있으니 링크/코드를 공개하지 마세요

function quadOf(my,cl){return my<70?(cl>=70?['🔥 나만 놓친 곳','1순위 복습! 반 친구들은 잘 맞힌 파트예요.','#f0506e']:['🤝 모두 어려웠던 곳','반 전체가 어려워했어요. 수업 자료를 다시 보면 좋아요.','#f2a516']):(cl>=70?['✅ 탄탄한 기본','지금처럼 유지하면 돼요.','#2fb879']:['⭐ 나만의 강점','반 친구들보다 확실히 잘 아는 파트예요!','#4d9fff'])}

    if(r&&r[1]){ok++;if(!cur)cs=k;cur++;if(cur>best){best=cur;bs=cs;be=k}}else cur=0;pts.push([cx,base-(base-top)*ok/(k+1)]);
    s+=`<rect class="by" style="animation-delay:${k*.04}s" x="${cx-bw/2}" y="${base-hh}" width="${bw}" height="${hh}" rx="7" fill="${cl}" fill-opacity=".8" stroke="#4a3b52" stroke-width="2"/>`;

  const d=pts.map((p,k)=>(k?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '),L=pts.reduce((x,p,k)=>k?x+Math.hypot(p[0]-pts[k-1][0],p[1]-pts[k-1][1]):0,0);

<div class="sec"><h3>🧩 파트별 평균</h3><p class="cap">80% 이상 탄탄 · 60~79% 보통 · 60% 미만 보충 필요</p>${PL.map(t=>{const[lb,cl]=lvOf(cls.part[t]);return `<div style="display:grid;grid-template-columns:minmax(80px,140px) 1fr 120px;gap:10px;align-items:center;margin:10px 0;font-size:17px"><span>${esc(t)}</span><div class="mini" style="height:20px"><i class="bw" style="width:${cls.part[t]}%;background:${pcol(t)}"></i></div><span>${cls.part[t]}% <em class="lv ${cl}">${lb}</em></span></div>`}).join('')}</div></div>
<div class="sec"><h3>🫧 학생 분포 (파트별)</h3><p class="cap">점 하나가 학생 한 명이에요. 점에 마우스를 올리면 이름이 보여요. ◆는 반 평균. 빨간 구간에 점이 몰린 파트가 수업 보강 1순위예요.</p>${sp}</div>`}
else if(tTab==='item'){
  const mis=IS.filter(x=>x.wk>=0&&x.an>=2&&x.wc>0).sort((a,b)=>b.wp-a.wp).slice(0,3);
  let h=`<div class="sec" style="background:#fff8fa"><h3>🧠 오개념 TOP ${mis.length||''}</h3><p class="cap">학생들이 가장 많이 고른 '오답 보기'예요. 같은 오해를 하고 있다는 신호예요.</p><div class="mcs">${mis.map(x=>`<div class="mc"><b class="pct">${x.wp}%</b>${x.k+1}번 [${esc(x.q.t)}] 에서 <b>'${esc(optTxt(x.q,x.wk))}'</b> 선택<br><small>정답: ${esc(optTxt(x.q,x.q.a))}</small><br><small style="opacity:.75">💡 ${strip(x.q.e||'').slice(0,80)}</small></div>`).join('')||'<p class="hint">아직 뚜렷한 오개념이 없어요.</p>'}</div></div>`;
  h+=`<div class="sec"><h3>🔍 문항 분석</h3><p class="cap">문항을 누르면 선택지별 인원이 보여요. <b>변별도</b>는 상위 27%와 하위 27% 학생의 정답률 차이(완료 6명 이상일 때)로, 0.3 이상이면 실력을 잘 가르는 좋은 문항이에요.</p>
<div class="qrow hd"><span>문항</span><span>내용</span><span>정답률</span><span>선택지 분포</span><span>변별도</span><span>평균시간</span></div>
${IS.map(x=>{const tot=x.cnt.reduce((a,b)=>a+b,0),dc=x.di==null?['-','#eee']:x.di>=.3?[x.di.toFixed(2),'#c8f2dc']:x.di>=.2?[x.di.toFixed(2),'#ffeab0']:[x.di.toFixed(2),'#ffd0d8'];
 return `<div class="qrow" data-k="${x.k}"><span><b>Q${x.k+1}</b></span><span class="qt"><span class="lv" style="background:${pcol(x.q.t)};color:#fff;border-color:${pcol(x.q.t)}">${esc(x.q.t)}</span> ${esc(strip(x.q.q))}</span>
<span><div class="mini"><i class="bw" style="width:${x.pc||0}%;background:${x.pc==null?'#ddd':LVC[lvOf(x.pc)[1]]}"></i></div><small>${x.pc==null?'-':x.pc+'% ('+x.ok+'/'+x.an+')'}</small></span>
<span><div class="stk">${tot?x.cnt.map((c,j)=>c?`<i style="width:${c/tot*100}%;background:${j===x.q.a?'#2fb879':OPC[j%OPC.length]}" title="${esc(optTxt(x.q,j))}: ${c}명">${x.q.ox?(j?'X':'O'):j+1}</i>`:'').join(''):'<i style="width:100%;background:#eee"></i>'}</div></span>
<span><span class="dc" style="background:${dc[1]}">${dc[0]}</span></span><span>${x.t==null?'-':x.t+'초'}</span></div>
${tSel===x.k?`<div class="fb show" style="margin:8px 0 12px"><b>Q${x.k+1}.</b> ${x.q.q}${x.q.o.map((o,j)=>`<div class="dr ${j===x.q.a?'ok':''}"><span>${j===x.q.a?'✅':'▫️'} ${esc(optTxt(x.q,j))}</span><div class="bar"><i style="width:${tot?x.cnt[j]/tot*100:0}%"></i></div><span>${x.cnt[j]}명</span></div>`).join('')}<div style="margin-top:10px;font-size:.85em">💡 ${x.q.e||''}</div></div>`:''}`}).join('')}</div>`;
  v.innerHTML=h;v.querySelectorAll('.qrow[data-k]').forEach(r=>r.onclick=()=>{const k=+r.dataset.k;tSel=tSel===k?null:k;tSig='';render()})}
else if(tTab==='stu'){
  const rows=[...D].sort((a,b)=>st(b).s-st(a).s||String(a.n).localeCompare(String(b.n),'ko'));
  const runs2=[];Q.forEach((q,k)=>{const l=runs2[runs2.length-1];if(l&&l.t===q.t)l.c++;else runs2.push({t:q.t,c:1})});
  let h=`<div class="sec"><h3>🗺 반 전체 히트맵</h3><p class="cap">한 줄이 학생 한 명, 한 칸이 문항이에요. 초록=정답, 분홍=오답, 회색=아직. 세로로 분홍이 몰린 열이 반 전체의 약점이에요. 이름을 누르면 그 학생 리포트가 열려요.</p>
<div class="hmw"><table class="hm"><thead><tr><th></th><th></th>${runs2.map(r=>`<th class="ph" colspan="${r.c}" style="background:${pcol(r.t)}">${esc(r.t.length>r.c*3?r.t.slice(0,Math.max(2,r.c*3-1))+'…':r.t)}</th>`).join('')}<th></th><th></th></tr>
<tr><th style="font-size:13px">이름</th><th style="font-size:13px">학번</th>${Q.map((_,k)=>`<th style="font-size:11px;opacity:.6">${k+1}</th>`).join('')}<th style="font-size:13px">점수</th><th style="font-size:13px">파트 프로필</th></tr></thead><tbody>
${rows.map(p=>{const S=st(p),rc=p.r?Object.values(p.r).filter(x=>x===1).length:0;return `<tr><td class="nm"><a href="#" data-id="${esc(p.id)}" style="color:inherit">${p.d?'🏁':'👀'} ${esc(p.n)}</a></td><td class="sc" style="font-size:13px;opacity:.7">${esc(p.no||'')}</td>${Q.map((_,k)=>{const r=p.a&&p.a[k];return `<td class="c ${r?(r[1]?'ok':'no'):'na'}" title="${esc(p.n)} · ${k+1}번 ${r?(r[1]?'정답':'오답: '+esc(optTxt(Q[k],r[0]))):'아직'}"></td>`}).join('')}
<td class="sc"><b>${S.s}</b>/${Q.length}${rc?` <small title="재도전 성공">🔁${rc}</small>`:''}</td><td class="sc"><svg width="${PL.length*16}" height="26">${S.parts.map((x,j)=>`<rect x="${j*16+2}" y="${24-Math.max(2,x.pc*.22)}" width="12" height="${Math.max(2,x.pc*.22)}" rx="3" fill="${pcol(x.t)}"><title>${esc(x.t)} ${x.pc}%</title></rect>`).join('')}</svg></td></tr>`}).join('')}</tbody></table></div></div>`;
  v.innerHTML=h;v.querySelectorAll('a[data-id]').forEach(a=>a.onclick=e=>{e.preventDefault();const p=tData.find(x=>x.id===a.dataset.id);if(p)printView([p],tData)})}
}

function csv(){const D=[...tData].sort((x,y)=>String(x.n).localeCompare(String(y.n),'ko'));if(!D.length){alert('아직 데이터가 없어요.');return}
  const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
  const head=['이름','학번','완료','점수','정답률(%)',...PL.map(t=>t+'(%)'),'가장 약한 파트','걸린 시간',...Q.map((_,k)=>'Q'+(k+1))];
  const lines=[head.map(q).join(',')].concat(D.map(p=>{const S=st(p),w=[...S.parts].sort((a,b)=>a.pc-b.pc)[0];
    return [p.n,p.no||'',p.d?'O':'',S.s,S.pc,...S.parts.map(x=>x.pc),w&&w.pc<80?w.t:'',p.d&&p.f&&p.st?fmtT(p.f-p.st):'',...Q.map((_,k)=>{const r=p.a&&p.a[k];return r?(r[1]?'O':'X('+(Q[k].ox?(r[0]?'X':'O'):r[0]+1)+')'):''})].map(q).join(',')}));
  const b=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='춘해퀴즈_'+QUIZ+'_라운드'+tRound+'_'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

async function resetRound(){const b=$('#br');
if(!resetArm){resetArm=true;b.textContent='⚠️ 한 번 더 누르면 초기화';setTimeout(()=>{resetArm=false;const x=$('#br');if(x&&!x.disabled)x.textContent='🔄 새 라운드'},3000);return}
resetArm=false;b.disabled=true;b.textContent='초기화 중...';let err='';
try{tRound=Number(await rpc('quiz_reset',{p_quiz:QUIZ,p_pw:tPw}))||tRound+1}catch(e){console.error(e);err=e&&e.message||String(e)}
tSel=null;if(!err)tData=[];tSig='';b.disabled=false;b.textContent='🔄 새 라운드';
if(err){const s=$('#st');if(s)s.textContent='⚠️ 새 라운드 실패: '+err;return}
refresh()}

function qrOpen(){const o=document.createElement('div');o.className='ov';o.id='ov';document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};qrDraw()}
function qrDraw(){const o=$('#ov');if(!o)return;
if(!tUrl){o.innerHTML=`<div class="card"><h2 style="margin-top:0">📱 입장 QR 만들기</h2><p class="sub">이 퀴즈의 <b>공유 링크</b>를 붙여 넣어 주세요</p>
<input class="inp" id="ui" placeholder="https://..." style="max-width:100%;font-size:18px">
<div style="margin-top:18px"><button class="btn" id="ub">QR 만들기</button> <button class="btn alt" id="uc">닫기</button></div></div>`;
  const go=()=>{const v=$('#ui').value.trim();if(/^https?:\/\//.test(v)){tUrl=v;qrDraw()}else{$('#ui').style.borderColor='var(--bad)'}};
  $('#ub').onclick=go;$('#ui').onkeydown=e=>{if(e.key==='Enter')go()};$('#uc').onclick=()=>o.remove();$('#ui').focus();return}
o.innerHTML=`<div class="card"><h1 style="font-size:clamp(28px,5vw,44px)">카메라로 찍고 입장! 📸</h1><div id="qr"></div>
<div style="word-break:break-all;font-size:14px;opacity:.7;margin-bottom:14px">${esc(tUrl)}</div>
<button class="btn" id="uc">닫기</button><br><button class="link" id="ue">링크 바꾸기</button></div>`;
$('#uc').onclick=()=>o.remove();$('#ue').onclick=()=>{tUrl='';qrDraw()};
if(window.QRCode){new QRCode($('#qr'),{text:tUrl,width:512,height:512,correctLevel:QRCode.CorrectLevel.M})}
else $('#qr').textContent='QR 라이브러리를 불러오지 못했어요. 링크를 직접 공유해 주세요.'}

/* 문제 검사: 잘못 쓴 문제가 있으면 콘솔과 화면 위쪽에 알려 줘요 */
(function(){const er=[];Q.forEach((q,k)=>{if(!q.t)er.push((k+1)+'번: 파트(t) 없음');if(!Array.isArray(q.o)||q.o.length<2)er.push((k+1)+'번: 보기(o) 확인');else if(!(q.a>=0&&q.a<q.o.length))er.push((k+1)+'번: 정답 번호(a)가 보기 범위를 벗어남')});
 if(er.length){console.warn(er);const d=document.createElement('div');d.className='timeup';d.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:99;font-size:16px';d.textContent='⚠️ 문제 확인 필요: '+er.join(' / ');document.body.appendChild(d)}})();
home();
</script>
