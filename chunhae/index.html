<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>춘해보건대학교 쑥쑥 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--pink:#ffd6e0;--pink2:#ff8fab;--mint:#d4f5e4;--mint2:#4cc38a;--yel:#fff3bf;--yel2:#f7b731;--sky:#d6ecff;--ink:#4a3b52;--bg:#fff8f0;--card:#fff;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background-image:radial-gradient(var(--pink) 2px,transparent 2px),radial-gradient(var(--sky) 2px,transparent 2px);background-size:36px 36px;background-position:0 0,18px 18px}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 40px}
.wrap.wide{max-width:1240px}
.card{background:var(--card);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:26px 24px}
h1{margin:0;font-size:clamp(30px,6vw,52px);text-align:center;line-height:1.25}
h2{font-size:clamp(22px,3.4vw,30px)}h3{margin:22px 0 10px;font-size:22px;font-weight:normal}
.mascot{font-size:clamp(70px,14vw,120px);text-align:center;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.sub{text-align:center;font-size:clamp(18px,3vw,24px);margin:8px 0 22px}
.btn{font-family:inherit;font-size:clamp(20px,3.4vw,28px);background:var(--yel2);color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:.08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.6;cursor:default}
.btn.sm{font-size:18px;padding:6px 16px;border-width:3px;box-shadow:0 4px 0 var(--ink)}
.btn.alt{background:var(--sky)}.btn.red{background:var(--pink2)}
.center{text-align:center}
.inp{font-family:inherit;font-size:26px;color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:10px 16px;width:100%;max-width:380px;text-align:center;outline:none}
.inp:focus{background:var(--yel)}
.link{background:none;border:none;font-family:inherit;color:var(--ink);opacity:.55;text-decoration:underline;cursor:pointer;font-size:16px;margin-top:22px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:clamp(18px,3vw,24px)}
.bar{flex:1;height:22px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink2),var(--yel2));transition:width .4s}
.score{background:var(--yel);border:3px solid var(--ink);border-radius:999px;padding:2px 14px}
.tag{display:inline-block;background:var(--sky);border:3px solid var(--ink);border-radius:999px;padding:2px 14px;font-size:clamp(15px,2.4vw,20px);margin-bottom:10px}
.q{font-size:clamp(24px,4.4vw,38px);line-height:1.4;margin:6px 0 20px;word-break:keep-all}
.opts{display:grid;gap:14px}
.opt{font-family:inherit;text-align:left;font-size:clamp(20px,3.4vw,30px);line-height:1.35;color:var(--ink);background:var(--pink);border:4px solid var(--ink);border-radius:22px;padding:14px 18px;cursor:pointer;box-shadow:0 6px 0 var(--ink);display:flex;gap:14px;align-items:center;word-break:keep-all;transition:.08s}
.opt:nth-child(2){background:var(--mint)}.opt:nth-child(3){background:var(--yel)}.opt:nth-child(4){background:var(--sky)}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.opt .n{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:26px}
.opt:disabled{cursor:default}
.opt.right{background:var(--mint2)!important;animation:pop .5s}
.opt.wrong{background:var(--bad)!important;animation:shake .4s;color:#fff}
.opt.dim{opacity:.45}
.ox{grid-template-columns:1fr 1fr}.ox .opt{justify-content:center;font-size:clamp(34px,7vw,64px);padding:22px}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin-top:20px;border:4px dashed var(--ink);border-radius:22px;padding:14px 18px;background:#fffdf5;font-size:clamp(18px,3vw,26px);line-height:1.5;display:none;word-break:keep-all}
.fb.show{display:block;animation:pop .4s}
.fb b{font-size:1.15em}
.next{margin-top:20px;display:none;text-align:right}.next.show{display:block}
.hint{text-align:center;margin-top:16px;font-size:16px;opacity:.7}
.big{font-size:clamp(54px,12vw,110px);text-align:center;line-height:1.1}
.res{font-size:clamp(22px,4vw,34px);text-align:center;margin:10px 0 20px}
.wrongs{margin:16px 0 0;padding:0;list-style:none;font-size:clamp(16px,2.6vw,22px);text-align:left}
.wrongs li{background:var(--pink);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.conf{position:fixed;top:-20px;font-size:28px;pointer-events:none;animation:fall 1.6s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
/* 교사 대시보드 */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0 0}
.stat{background:var(--yel);border:3px solid var(--ink);border-radius:18px;padding:10px;text-align:center;font-size:18px}
.stat:nth-child(2){background:var(--mint)}.stat:nth-child(3){background:var(--pink)}.stat:nth-child(4){background:var(--sky)}
.stat b{display:block;font-size:40px;font-weight:normal}
.qbars{display:grid;gap:6px}
.qb{display:grid;grid-template-columns:48px 1fr 110px;gap:10px;align-items:center;cursor:pointer;font-size:18px;padding:3px 8px;border-radius:12px}
.qb:hover,.qb.sel{background:var(--yel)}
.qb.low .bar>i{background:var(--bad)}
.qb .bar{height:20px}
.dr{display:grid;grid-template-columns:1fr minmax(100px,220px) 54px;gap:10px;align-items:center;margin-top:8px;font-size:.85em}
.dr.ok{color:#1e7a4f}.dr .bar{height:16px}.dr.ok .bar>i{background:var(--mint2)}
.tbl{overflow:auto;max-height:62vh;border:3px solid var(--ink);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{border:1.5px solid #c9bfd0;padding:5px 6px;text-align:center}
th{background:var(--sky);position:sticky;top:0;z-index:1}
td.nm{text-align:left;white-space:nowrap}
td.c-ok{background:var(--mint)}td.c-no{background:#ffd3d3}
.wait{font-size:22px;padding:30px 10px}
.live{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--mint2);margin-right:6px;animation:blink 1s infinite;vertical-align:middle}
@keyframes blink{50%{opacity:.2}}
.ov{position:fixed;inset:0;background:rgba(74,59,82,.6);display:grid;place-items:center;z-index:20;padding:16px}
.ov .card{max-width:760px;width:100%;text-align:center;max-height:96vh;overflow:auto}
#qr{display:inline-block;background:#fff;padding:16px;border:4px solid var(--ink);border-radius:20px;margin:14px 0}
#qr img,#qr canvas{display:block;width:min(58vh,70vw);height:auto}
td.tm{white-space:nowrap;font-size:15px}
.tmr{white-space:nowrap}.tmr.low{background:var(--bad);color:#fff;animation:blink 1s infinite}
.timeup{background:var(--bad);color:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-size:clamp(20px,3.6vw,30px);text-align:center;margin:0 0 12px}
.fld{display:grid;gap:10px;justify-items:center;margin-top:6px}
.lv{font-style:normal;border:2px solid var(--ink);border-radius:999px;padding:0 10px;font-size:.8em;white-space:nowrap}
.lv.good{background:var(--mint)}.lv.mid{background:var(--yel)}.lv.low{background:#ffd3d3}
/* ================= 리포트 v2 ================= */
.wrap.mid{max-width:1060px}
.rep{font-family:'Pretendard Variable',Pretendard,'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink);text-align:left;word-break:keep-all;line-height:1.5}
.rep h2,.rep h3,.jua{font-family:'Jua','Malgun Gothic',sans-serif;font-weight:normal}
.rh{position:relative;overflow:hidden;display:grid;grid-template-columns:210px 1fr;gap:24px;align-items:center;padding:26px 28px;border-radius:28px;color:#fff;background:linear-gradient(130deg,#5b4bc4 0%,#9d5fd6 38%,#ff7fa8 72%,#ffb571 100%);box-shadow:0 18px 36px -16px rgba(91,75,196,.7)}
.rh:before,.rh:after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.13);pointer-events:none}
.rh:before{width:300px;height:300px;right:-80px;top:-120px}.rh:after{width:180px;height:180px;left:38%;bottom:-110px}
.rh>*{position:relative;z-index:1}
.spark{position:absolute;color:#fff;opacity:.55;font-size:18px;z-index:0}
.anim .spark{animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.1;transform:scale(.6)}}
.ring{width:200px;height:200px;display:block;margin:auto;overflow:visible}
.ring .bg{fill:rgba(255,255,255,.12);stroke:rgba(255,255,255,.28);stroke-width:16}
.ring .fg{fill:none;stroke:#fff;stroke-width:16;stroke-linecap:round;transform:rotate(-90deg);transform-box:fill-box;transform-origin:center;filter:drop-shadow(0 0 6px rgba(255,255,255,.8))}
.anim .ring .fg{animation:ringIn 1.8s cubic-bezier(.2,.8,.2,1) both}
@keyframes ringIn{from{stroke-dashoffset:var(--c)}}
.ring text{fill:#fff;font-family:'Jua';text-anchor:middle}
.rh-k{font-size:13px;letter-spacing:1.5px;opacity:.9;font-weight:700}
.rh h2{font-size:clamp(28px,4.6vw,42px);margin:4px 0 2px;line-height:1.15}
.rh-s{opacity:.88;font-size:15px}
.type{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.17);border:2px solid rgba(255,255,255,.55);border-radius:20px;padding:10px 16px;margin:14px 0 12px;backdrop-filter:blur(6px)}
.type em{font-style:normal;font-size:44px;line-height:1}.type b{font-family:'Jua';font-weight:normal;font-size:24px;display:block;line-height:1.2}.type span{font-size:15px;opacity:.95}
.anim .type em{animation:pop2 .9s .9s cubic-bezier(.3,1.6,.5,1) both}@keyframes pop2{from{transform:scale(0) rotate(-30deg)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{background:rgba(255,255,255,.22);border-radius:999px;padding:5px 13px;font-size:14px;font-weight:700}
.one{margin:18px 0 4px;padding:16px 20px 16px 58px;border-radius:22px;background:#fff;border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink);font-size:clamp(16.5px,2.3vw,20px);line-height:1.7;position:relative}
.one:before{content:'💬';position:absolute;left:16px;top:14px;font-size:28px}
.one b{background:linear-gradient(transparent 58%,#ffe08a 58%);font-weight:800}
.sec{margin-top:28px;break-inside:avoid}
.sh{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.sh i{font-style:normal;width:36px;height:36px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:'Jua';font-size:19px;flex:none;box-shadow:0 3px 0 #9d8fa8}
.sh h3{margin:0;font-size:clamp(21px,3vw,27px)}.sh small{opacity:.62;font-size:14px;margin-left:auto}
.panel{background:#fff;border:3px solid var(--ink);border-radius:24px;padding:18px 20px;box-shadow:0 6px 0 var(--ink)}
.map{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:18px;align-items:center}.map.one-col{grid-template-columns:1fr}
.radar2{width:100%;height:auto;display:block}
.anim .radar2 .me{animation:grow 1.3s .35s cubic-bezier(.2,.9,.3,1.25) both;transform-box:view-box}
@keyframes grow{from{transform:scale(0);opacity:0}}
.lg{display:flex;gap:16px;justify-content:center;font-size:13.5px;margin-top:2px;flex-wrap:wrap}.lg span{display:flex;align-items:center;gap:6px}.lg i{width:24px;height:0;border-top:4px solid}
.pcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:11px}
.pc2{border:2.5px solid var(--ink);border-radius:18px;padding:12px 14px 12px 18px;background:#fff;position:relative;overflow:hidden}
.pc2:before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--pc)}
.anim .pc2{animation:up .6s var(--d,0s) cubic-bezier(.2,.8,.2,1) both}@keyframes up{from{transform:translateY(16px);opacity:0}}
.pc2 .h{display:flex;align-items:center;gap:7px;font-family:'Jua';font-size:18.5px}
.pc2 .h em{font-style:normal;font-size:22px}
.pc2 .v{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;margin:2px 0}
.pc2 .v b{font-family:'Jua';font-weight:normal;font-size:40px;line-height:1.05;color:var(--pcd,var(--ink))}
.dl{font-size:12.5px;font-weight:800;border-radius:999px;padding:2px 9px;white-space:nowrap}.dl.up{background:#d3f9d8;color:#1e7a4f}.dl.dn{background:#ffe3e3;color:#c92a2a}.dl.eq{background:#eee;color:#555}
.meter{height:11px;border-radius:99px;background:#f1ecf4;position:relative;margin:20px 0 9px}
.meter>u{display:block;height:100%;border-radius:99px;background:var(--pc)}
.anim .meter>u{animation:wid 1.3s .3s cubic-bezier(.2,.8,.2,1) both}@keyframes wid{from{width:0}}
.meter>s{position:absolute;top:-5px;width:4px;height:21px;background:var(--ink);border-radius:2px}
.meter>s:after{content:'반';position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:800;text-decoration:none;color:var(--ink)}
.dots{display:flex;flex-wrap:wrap;gap:4px}.dots span{width:25px;height:25px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff}
.dots .o{background:#3fbf7f}.dots .x{background:#ff6b6b}.dots .n{background:#c9bfd0}
.cmp2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.mx svg,.hist svg,.rhy svg{width:100%;height:auto;display:block}.rhy svg{max-width:820px;margin:0 auto}
.anim .bub{animation:pop2 .8s var(--d,0s) cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
.anim .hb{animation:hb .9s var(--d,0s) cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}@keyframes hb{from{transform:scaleY(0)}}
.anim .pin{animation:drop 1s 1s cubic-bezier(.3,1.5,.5,1) both}@keyframes drop{from{transform:translateY(-30px);opacity:0}}
.mxl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mxl div{border-radius:14px;padding:8px 11px;font-size:13.5px;line-height:1.45;border:2px solid rgba(74,59,82,.15)}
.mxl b{font-family:'Jua';font-weight:normal;font-size:16px;display:block}
.mxl u{text-decoration:none;font-weight:800}
.ptitle{font-family:'Jua';font-size:18px;margin:0 0 6px}
.q4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.q4 div{border-radius:16px;padding:10px 12px;border:2.5px solid var(--ink);font-size:13.5px;line-height:1.45}
.q4 b{font-family:'Jua';font-weight:normal;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.q4 b big{font-size:28px}
.q4 p{margin:4px 0 6px}
.qn{display:inline-block;background:rgba(255,255,255,.75);border:1.5px solid rgba(74,59,82,.3);border-radius:8px;padding:0 6px;margin:2px 3px 0 0;font-weight:800;font-size:12.5px}
.rx{border:3px solid var(--ink);border-radius:22px;overflow:hidden;margin-bottom:16px;background:#fff;box-shadow:0 6px 0 var(--ink);break-inside:avoid}
.rx-h{display:flex;gap:14px;align-items:center;padding:13px 18px;background:var(--pcl);border-bottom:2.5px dashed var(--ink)}
.rx-h .no{font-family:'Jua';font-size:28px;width:50px;height:50px;border-radius:16px;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none;position:relative}
.rx-h .no:after{content:'Rx';position:absolute;top:-8px;right:-8px;background:var(--pc);color:#fff;font-size:11px;border-radius:8px;padding:1px 5px;border:2px solid var(--ink)}
.rx-h b{font-family:'Jua';font-weight:normal;font-size:22px;display:block;line-height:1.2}
.rx-h span{font-size:14px}
.rx-h .pct{margin-left:auto;font-family:'Jua';font-size:30px;white-space:nowrap}
.rx-b{padding:12px 18px 6px}
.ref{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px}.ref span{background:#f6f2fa;border:1.5px solid #d9cfe0;border-radius:12px;padding:5px 11px;font-size:14px;line-height:1.45}
.wq{border-left:6px solid #ff6b6b;background:#fff7f7;border-radius:0 16px 16px 0;padding:11px 15px;margin:10px 0 12px;font-size:15.5px;line-height:1.6}
.wq .qq{font-weight:700}
.wq .an{display:flex;flex-wrap:wrap;gap:6px 16px;margin:6px 0;font-size:14.5px}
.wq .my{color:#c92a2a;text-decoration:line-through;text-decoration-thickness:2px}
.wq .ok{color:#1e7a4f;font-weight:800}
.wq .ex{background:#fff;border:1.5px dashed #e4cfd5;border-radius:12px;padding:8px 11px;font-size:14.5px}
.tg{display:inline-block;font-size:12px;font-weight:800;border-radius:999px;padding:1px 9px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.tg.rush{background:#ffe8cc;color:#b35c00}.tg.deep{background:#e7f5ff;color:#1864ab}.tg.miss{background:#eee;color:#555}.tg.re{background:#d3f9d8;color:#1e7a4f}
.note{font-size:13px;opacity:.66;margin-top:6px}
.lock{text-align:center;padding:22px 10px;font-size:16px;background:repeating-linear-gradient(45deg,#faf7fc,#faf7fc 12px,#f3eef7 12px,#f3eef7 24px);border-radius:18px;border:2px dashed #cdbfd8}
.lock b{font-family:'Jua';font-weight:normal;font-size:21px;display:block;margin-bottom:4px}
.cta{margin-top:26px;border-radius:24px;padding:20px;text-align:center;background:linear-gradient(120deg,#fff3bf,#ffd6e0);border:3px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.cta h3{margin:0 0 4px;font-size:24px}.cta p{margin:0 0 12px}
.scan{width:150px;height:150px;margin:10px auto 6px;border-radius:50%;background:conic-gradient(#5b4bc4,#ff7fa8,#ffb571,#4cc38a,#5b4bc4);animation:spin 1.1s linear infinite;display:grid;place-items:center}
.scan-c{width:118px;height:118px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:54px;animation:spin 1.1s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:760px){.rh{grid-template-columns:1fr;text-align:center;padding:22px 18px}.type{text-align:left}.chips{justify-content:center}.map,.cmp2{grid-template-columns:1fr}.q4{grid-template-columns:1fr 1fr}.mxl{grid-template-columns:1fr}}
/* ================= 교사 대시보드 v2 ================= */
.tdash{font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif}
.tdash h2,.tdash h3{font-family:'Jua','Malgun Gothic',sans-serif;font-weight:normal}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin:14px 0 6px}
.kpi{border:3px solid var(--ink);border-radius:20px;padding:11px 14px;background:#fff;position:relative;overflow:hidden;box-shadow:0 5px 0 var(--ink)}
.kpi small{font-size:13.5px;opacity:.75;display:block;font-weight:700}.kpi b{font-family:'Jua';font-weight:normal;font-size:34px;line-height:1.15;display:block}.kpi span{font-size:12.5px;opacity:.7}
.kpi:after{content:'';position:absolute;right:-22px;top:-22px;width:76px;height:76px;border-radius:50%;background:var(--kc,#ffd6e0);opacity:.75}
.kpi>*{position:relative;z-index:1}
.tg2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.tg2{grid-template-columns:1fr}}
.ins{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.ins li{display:flex;gap:12px;align-items:flex-start;background:#fffdf5;border:2px solid #eadfcf;border-radius:16px;padding:11px 14px;font-size:15.5px;line-height:1.6}

function itemPlot(S){const W=470,H=330,L=50,T=14,R=W-12,B=H-46,X=v=>L+(R-L)*v/100,Y=v=>B-(B-T)*(v+.5)/1.5;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="문항 난이도와 변별도">`;
  s+=`<rect x="${L}" y="${Y(1)}" width="${R-L}" height="${Y(.3)-Y(1)}" fill="#e3f8ea"/><rect x="${L}" y="${Y(.3)}" width="${R-L}" height="${Y(.15)-Y(.3)}" fill="#fffbea"/><rect x="${L}" y="${Y(.15)}" width="${R-L}" height="${Y(0)-Y(.15)}" fill="#fff4e0"/><rect x="${L}" y="${Y(0)}" width="${R-L}" height="${Y(-.5)-Y(0)}" fill="#ffe3e6"/>`;
  s+=`<text x="${L+8}" y="${Y(1)+18}" text-anchor="start" font-family="Jua" font-size="14" fill="#1e7a4f">👍 변별력 좋음</text><text x="${L+8}" y="${B-8}" text-anchor="start" font-family="Jua" font-size="14" fill="#c92a2a">🔍 검토 필요 (상위권이 더 틀림)</text>`;
  s+=`<rect x="${L}" y="${T}" width="${R-L}" height="${B-T}" fill="none" stroke="#4a3b52" stroke-width="2.5" rx="4"/>`;
  [0,50,100].forEach(v=>s+=`<text x="${X(v)}" y="${B+16}" text-anchor="middle" font-size="11.5" fill="#7a6d84">${v}%</text>`);
  [-.5,0,.5,1].forEach(v=>s+=`<text x="${L-6}" y="${Y(v)+4}" text-anchor="end" font-size="11.5" fill="#7a6d84">${v}</text>`);
  s+=`<text x="${(L+R)/2}" y="${H-8}" text-anchor="middle" font-size="13" font-weight="800" fill="#4a3b52">정답률 → (왼쪽 = 어려운 문항)</text><text x="14" y="${(T+B)/2}" text-anchor="middle" font-size="13" font-weight="800" fill="#4a3b52" transform="rotate(-90 14 ${(T+B)/2})">변별도 →</text>`;
  const pts=Q.map((q,k)=>({k,x:X(S.q[k].pc),y:Y(Math.max(-.5,Math.min(1,S.D[k])))}));
  const cl=p=>{p.x=Math.max(L+15,Math.min(R-15,p.x));p.y=Math.max(T+15,Math.min(B-15,p.y))};pts.forEach(cl);
  for(let it=0;it<150;it++){let mv=false;pts.forEach((p,a)=>pts.forEach((o,b)=>{if(b<=a)return;let dx=o.x-p.x,dy=o.y-p.y,d=Math.hypot(dx,dy);if(d<28){if(d<.01){dx=1;dy=(a%2?1:-1)*.5;d=Math.hypot(dx,dy)}const m=(28-d)/2/d;p.x-=dx*m;p.y-=dy*m;o.x+=dx*m;o.y+=dy*m;mv=true}}));pts.forEach(cl);if(!mv)break}
  pts.forEach((p,j)=>s+=`<g class="bub" style="--d:${(.2+j*.05).toFixed(2)}s"><circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="13" fill="${pcol(Q[p.k].t)}" stroke="#4a3b52" stroke-width="2"/><text x="${p.x.toFixed(1)}" y="${(p.y+4.5).toFixed(1)}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">${p.k+1}</text><title>Q${p.k+1} · 정답률 ${Math.round(S.q[p.k].pc)}% · 변별도 ${S.D[p.k].toFixed(2)}</title></g>`);
  return s+'</svg>'}

el.querySelectorAll('td.nm[data-id]').forEach(td=>td.onclick=()=>{const p=tData.find(x=>x.id===td.dataset.id);if(p)printView([p],classStats(tData))})}

function csv(){const D=[...tData].sort((x,y)=>String(x.n).localeCompare(String(y.n),'ko'));if(!D.length)return;
const rows=[['학번','이름','완료','점수','정답률(%)',...PT.map(t=>t+'(%)'),'가장 약한 파트','걸린 시간','재도전 성공',...Q.map((_,k)=>'Q'+(k+1))]];
D.forEach(p=>{const ps=partStats(p.a),s2=scoreOf(p.a),w=[...ps].sort((x,y)=>x.pc-y.pc)[0],r=Object.values(p.rt||{});
  rows.push([p.no||'',p.n,p.d?'O':'풀이 중',s2,Math.round(s2/Q.length*100),...ps.map(x=>x.pc),w&&w.pc<80?w.t:'-',p.f&&p.st?fmtT(p.f-p.st):'',r.length?r.filter(v=>v==1).length+'/'+r.length:'',...Q.map((_,k)=>p.a&&p.a[k]?(p.a[k][1]?'O':'X'):'')])});
const txt='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
const u=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download=`${QUIZ}_결과_${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}

async function resetRound(){const b=$('#br');
if(!resetArm){resetArm=true;b.textContent='⚠️ 한 번 더 누르면 초기화';setTimeout(()=>{resetArm=false;const x=$('#br');if(x&&!x.disabled)x.textContent='🔄 새 라운드'},3000);return}
resetArm=false;b.disabled=true;b.textContent='초기화 중...';let err='';
try{tRound=Number(await rpc('quiz_reset',{p_quiz:QUIZ,p_pw:tPw}))||tRound+1}catch(e){console.error(e);err=e&&e.message||String(e)}
if(!err){tData=[];tSig='';tAnim=true}b.disabled=false;b.textContent='🔄 새 라운드';
if(err){const s=$('#st');if(s)s.textContent='⚠️ 새 라운드 실패: '+err;return}
render();refresh()}

function qrOpen(){const o=document.createElement('div');o.className='ov';o.id='ov';document.body.appendChild(o);o.onclick=e=>{if(e.target===o)o.remove()};qrDraw()}
function qrDraw(){const o=$('#ov');if(!o)return;
if(!tUrl){o.innerHTML=`<div class="card"><h2 style="margin-top:0">📱 입장 QR 만들기</h2><p class="sub">이 퀴즈의 <b>공유 링크</b>를 붙여 넣어 주세요</p>
<input class="inp" id="ui" placeholder="https://..." style="max-width:100%;font-size:18px">
<div style="margin-top:18px"><button class="btn" id="ub">QR 만들기</button> <button class="btn alt" id="uc">닫기</button></div></div>`;
  const go=()=>{const v=$('#ui').value.trim();if(/^https?:\/\//.test(v)){tUrl=v;qrDraw()}else{$('#ui').style.borderColor='var(--bad)'}};
  $('#ub').onclick=go;$('#ui').onkeydown=e=>{if(e.key==='Enter')go()};$('#uc').onclick=()=>o.remove();$('#ui').focus();return}
o.innerHTML=`<div class="card"><h1 style="font-size:clamp(28px,5vw,44px)">카메라로 찍고 입장! 📸</h1><div id="qr"></div>
<div style="word-break:break-all;font-size:14px;opacity:.7;margin-bottom:14px">${esc(tUrl)}</div>
<button class="btn" id="uc">닫기</button><br><button class="link" id="ue">링크 바꾸기</button></div>`;
$('#uc').onclick=()=>o.remove();$('#ue').onclick=()=>{tUrl='';qrDraw()};
if(window.QRCode){new QRCode($('#qr'),{text:tUrl,width:512,height:512,correctLevel:QRCode.CorrectLevel.M})}
else $('#qr').textContent='QR 라이브러리를 불러오지 못했어요. 링크를 직접 공유해 주세요.'}

home();
</script>
</body></html>
