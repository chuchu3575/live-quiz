<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>지체장애 쑥쑥 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--pink:#ffd6e0;--pink2:#ff8fab;--mint:#d4f5e4;--mint2:#4cc38a;--yel:#fff3bf;--yel2:#f7b731;--sky:#d6ecff;--ink:#4a3b52;--bg:#fff8f0;--card:#fff;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background-image:radial-gradient(var(--pink) 2px,transparent 2px),radial-gradient(var(--sky) 2px,transparent 2px);background-size:36px 36px;background-position:0 0,18px 18px}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 40px}
.wrap.wide{max-width:1240px}
.card{background:var(--card);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:26px 24px}
h1{margin:0;font-size:clamp(30px,6vw,52px);text-align:center;line-height:1.25}
h2{font-size:clamp(22px,3.4vw,30px)}h3{margin:22px 0 10px;font-size:22px;font-weight:normal}
.mascot{font-size:clamp(70px,14vw,120px);text-align:center;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.sub{text-align:center;font-size:clamp(18px,3vw,24px);margin:8px 0 22px}
.btn{font-family:inherit;font-size:clamp(20px,3.4vw,28px);background:var(--yel2);color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:.08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.6;cursor:default}
.btn.sm{font-size:18px;padding:6px 16px;border-width:3px;box-shadow:0 4px 0 var(--ink)}
.btn.alt{background:var(--sky)}.btn.red{background:var(--pink2)}
.center{text-align:center}
.inp{font-family:inherit;font-size:26px;color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:10px 16px;width:100%;max-width:380px;text-align:center;outline:none}
.inp:focus{background:var(--yel)}
.link{background:none;border:none;font-family:inherit;color:var(--ink);opacity:.55;text-decoration:underline;cursor:pointer;font-size:16px;margin-top:22px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:clamp(18px,3vw,24px)}
.bar{flex:1;height:22px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink2),var(--yel2));transition:width .4s}
.score{background:var(--yel);border:3px solid var(--ink);border-radius:999px;padding:2px 14px}
.tag{display:inline-block;background:var(--sky);border:3px solid var(--ink);border-radius:999px;padding:2px 14px;font-size:clamp(15px,2.4vw,20px);margin-bottom:10px}
.q{font-size:clamp(24px,4.4vw,38px);line-height:1.4;margin:6px 0 20px;word-break:keep-all}
.opts{display:grid;gap:14px}
.opt{font-family:inherit;text-align:left;font-size:clamp(20px,3.4vw,30px);line-height:1.35;color:var(--ink);background:var(--pink);border:4px solid var(--ink);border-radius:22px;padding:14px 18px;cursor:pointer;box-shadow:0 6px 0 var(--ink);display:flex;gap:14px;align-items:center;word-break:keep-all;transition:.08s}
.opt:nth-child(2){background:var(--mint)}.opt:nth-child(3){background:var(--yel)}.opt:nth-child(4){background:var(--sky)}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.opt .n{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:26px}
.opt:disabled{cursor:default}
.opt.right{background:var(--mint2)!important;animation:pop .5s}
.opt.wrong{background:var(--bad)!important;animation:shake .4s;color:#fff}
.opt.dim{opacity:.45}
.ox{grid-template-columns:1fr 1fr}.ox .opt{justify-content:center;font-size:clamp(34px,7vw,64px);padding:22px}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin-top:20px;border:4px dashed var(--ink);border-radius:22px;padding:14px 18px;background:#fffdf5;font-size:clamp(18px,3vw,26px);line-height:1.5;display:none;word-break:keep-all}
.fb.show{display:block;animation:pop .4s}
.fb b{font-size:1.15em}
.next{margin-top:20px;display:none;text-align:right}.next.show{display:block}
.hint{text-align:center;margin-top:16px;font-size:16px;opacity:.7}
.big{font-size:clamp(54px,12vw,110px);text-align:center;line-height:1.1}
.res{font-size:clamp(22px,4vw,34px);text-align:center;margin:10px 0 20px}
.wrongs{margin:16px 0 0;padding:0;list-style:none;font-size:clamp(16px,2.6vw,22px);text-align:left}
.wrongs li{background:var(--pink);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.conf{position:fixed;top:-20px;font-size:28px;pointer-events:none;animation:fall 1.6s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
/* 교사 대시보드 */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0 0}
.stat{background:var(--yel);border:3px solid var(--ink);border-radius:18px;padding:10px;text-align:center;font-size:18px}
.stat:nth-child(2){background:var(--mint)}.stat:nth-child(3){background:var(--pink)}.stat:nth-child(4){background:var(--sky)}
.stat b{display:block;font-size:40px;font-weight:normal}
.qbars{display:grid;gap:6px}
.qb{display:grid;grid-template-columns:48px 1fr 110px;gap:10px;align-items:center;cursor:pointer;font-size:18px;padding:3px 8px;border-radius:12px}
.qb:hover,.qb.sel{background:var(--yel)}
.qb.low .bar>i{background:var(--bad)}
.qb .bar{height:20px}
.dr{display:grid;grid-template-columns:1fr minmax(100px,220px) 54px;gap:10px;align-items:center;margin-top:8px;font-size:.85em}
.dr.ok{color:#1e7a4f}.dr .bar{height:16px}.dr.ok .bar>i{background:var(--mint2)}
.tbl{overflow:auto;max-height:62vh;border:3px solid var(--ink);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{border:1.5px solid #c9bfd0;padding:5px 6px;text-align:center}
th{background:var(--sky);position:sticky;top:0;z-index:1}
td.nm{text-align:left;white-space:nowrap}
td.c-ok{background:var(--mint)}td.c-no{background:#ffd3d3}
.wait{font-size:22px;padding:30px 10px}
.live{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--mint2);margin-right:6px;animation:blink 1s infinite;vertical-align:middle}
@keyframes blink{50%{opacity:.2}}
.ov{position:fixed;inset:0;background:rgba(74,59,82,.6);display:grid;place-items:center;z-index:20;padding:16px}
.ov .card{max-width:760px;width:100%;text-align:center;max-height:96vh;overflow:auto}
#qr{display:inline-block;background:#fff;padding:16px;border:4px solid var(--ink);border-radius:20px;margin:14px 0}
#qr img,#qr canvas{display:block;width:min(58vh,70vw);height:auto}
td.tm{white-space:nowrap;font-size:15px}
.tmr{white-space:nowrap}.tmr.low{background:var(--bad);color:#fff;animation:blink 1s infinite}
.timeup{background:var(--bad);color:#fff;border:3px solid var(--ink);border-radius:18px;padding:8px 14px;font-size:clamp(20px,3.6vw,30px);text-align:center;margin:0 0 12px}
/* 구슬 레이스 */
.conf{z-index:40}
.ov .card.race{max-width:1100px;padding:18px}
.rbox{display:flex;gap:12px;margin-top:10px;align-items:stretch}
.rcw{position:relative;flex:1;min-width:0}
#rcv{display:block;width:100%;height:min(68vh,760px);border:4px solid var(--ink);border-radius:18px;background:#fffdf5}
.rlist{width:200px;margin:0;padding:8px 10px 8px 36px;border:3px solid var(--ink);border-radius:16px;background:#fff;text-align:left;font-size:18px;overflow:auto;max-height:min(68vh,760px)}
.rlist li{margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rwin{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--yel);border:4px solid var(--ink);border-radius:20px;padding:6px 24px;font-size:clamp(26px,5vw,46px);display:none;white-space:nowrap;box-shadow:0 6px 0 var(--ink);z-index:2}
.rwin.show{display:block;animation:pop .6s}
@media(max-width:700px){.rbox{flex-direction:column}.rlist{width:auto;max-height:120px}}
/* 1등 뽑기 방식 선택 + 카트 레이스 */
.kboard,.ktop,.kfeed,.kmini,.kbtns,.kcam{z-index:6}
.kseg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 12px}
.kseg button{font-family:inherit;font-size:22px;color:var(--ink);background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 8px;cursor:pointer}
.kseg button small{display:block;font-size:14px;opacity:.7;margin-top:2px}
.kseg button.on{background:var(--yel);box-shadow:0 4px 0 var(--ink)}
.kseg.sm{display:inline-flex;gap:6px;margin:0;vertical-align:middle}
.kseg.sm button{font-size:17px;padding:3px 12px;border-radius:999px}
.kseg.sm button.on{box-shadow:0 3px 0 var(--ink)}
.kopts{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;align-items:center;font-size:18px;margin-bottom:4px}
.kopts b{font-weight:normal;margin-right:6px}
.kov{position:fixed;inset:0;z-index:30;background:#a7dcff;overflow:hidden;font-family:'Jua','Malgun Gothic',sans-serif;color:#fff;user-select:none}
.kov #kcv{position:absolute;inset:0;width:100%;height:100%;display:block}
.kload{position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:14px;font-size:clamp(26px,4vw,40px);color:var(--ink);background:var(--bg)}
#klbs{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
.klb{position:absolute;left:0;top:0;white-space:nowrap;background:rgba(43,43,51,.82);border:2px solid #fff;border-radius:999px;padding:1px 10px 1px 4px;font-size:17px;display:flex;align-items:center;gap:5px;transform-origin:50% 100%}
.klb i,.kboard i,.kall i,.kpn i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #fff;flex:none}
.kboard{position:absolute;left:12px;top:12px;display:grid;gap:4px;grid-template-columns:220px;max-height:calc(100% - 24px)}
.kboard.c2{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:190px}
.kboard.sm{grid-auto-columns:165px}
.kboard .kr{display:flex;align-items:center;gap:7px;background:rgba(43,43,51,.82);border-radius:10px;padding:3px 10px;font-size:20px;min-width:0}
.kboard .kr.top{background:#f7b731;color:var(--ink)}.kboard .kr.foc{outline:3px solid #7fe7ff}
.kboard .kp{width:26px;font-style:italic;color:#ffd43b;text-align:right;flex:none}.kboard .kr.top .kp{color:var(--ink)}
.kboard .kn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kboard.c2 .kr{font-size:17px}.kboard.sm .kr{font-size:14px;padding:1px 8px}
.ktop{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.kpill{background:rgba(43,43,51,.85);border-radius:16px;padding:4px 18px;font-size:clamp(22px,3vw,34px);font-style:italic;white-space:nowrap}.kpill b{color:#ffd43b;font-size:1.25em}
.kfeed{position:absolute;top:82px;left:50%;transform:translateX(-50%);display:grid;gap:8px;justify-items:center;pointer-events:none}
.kfeed div{border-radius:999px;padding:6px 22px;font-size:clamp(20px,2.6vw,30px);border:3px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.25);animation:pop .35s;white-space:nowrap}
.kmini{position:absolute;right:12px;top:12px;width:300px;height:190px;background:rgba(74,59,82,.55);border-radius:18px}
.kbtns{position:absolute;right:12px;top:214px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:440px}
.kbtns button{font-family:inherit;font-size:19px;background:rgba(43,43,51,.85);color:#fff;border:3px solid transparent;border-radius:14px;padding:6px 14px;cursor:pointer}
.kbtns button.on{background:#f7b731;color:var(--ink)}
.kcam{position:absolute;right:12px;bottom:14px;background:rgba(43,43,51,.85);border-left:6px solid #f7b731;border-radius:16px;padding:8px 18px;font-size:clamp(18px,2.4vw,28px)}.kcam b{color:#ffd43b}.kcam small{opacity:.75}
.klight{z-index:5;position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);display:flex;gap:16px;align-items:center;background:#2b2b33;border:5px solid #fff;border-radius:26px;padding:16px 22px}
.klight i{width:70px;height:70px;border-radius:50%;background:#555}
.klight span{font-size:70px;min-width:120px;text-align:center;color:#ffd43b}
.klight.l1 i:nth-child(1),.klight.l2 i:nth-child(-n+2),.klight.l3 i{background:#ff3b3b;box-shadow:0 0 24px #ff3b3b}
.klight.l4 i{background:#3ccf6e;box-shadow:0 0 24px #3ccf6e}.klight.l4 span{color:#3ccf6e}
.klight.off{display:none}
.kfinal{z-index:5;position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) scale(0);font-size:clamp(60px,11vw,140px);font-style:italic;color:#ffd43b;-webkit-text-stroke:4px #4a3b52;text-shadow:0 8px 0 #4a3b52;pointer-events:none;transition:transform .35s;white-space:nowrap}
.kfinal.show{transform:translate(-50%,-50%) scale(1)}
.kflash{position:absolute;inset:0;background:#fff8c4;opacity:0;pointer-events:none}
.kres{position:absolute;inset:0;z-index:20;display:none;place-items:center;background:rgba(43,43,51,.55);padding:16px;overflow:auto}
.kres.show{display:grid}
.kres-in{background:var(--card);color:var(--ink);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:20px 24px;max-width:1000px;width:100%;text-align:center}
.kres-in h2{margin:0 0 10px}.kres-in h2 small{font-size:.6em;opacity:.6}
.kpod{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:8px 0 14px}
.kpd{width:min(30%,240px)}.kpn{font-size:clamp(22px,3.4vw,36px);display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:6px;word-break:keep-all}
.kpn i{border-color:var(--ink);width:20px;height:20px}
.kpb{border:4px solid var(--ink);border-radius:16px 16px 0 0;display:grid;place-content:center;font-size:40px;line-height:1.1}.kpb b{font-size:46px}
.p1 .kpb{height:170px;background:#ffd43b}.p2 .kpb{height:125px;background:#e9ecef}.p3 .kpb{height:95px;background:#f4b183}
.kall{list-style:none;margin:0 0 14px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:6px;text-align:left;font-size:20px;max-height:28vh;overflow:auto}
.kall li{background:var(--yel);border:2px solid var(--ink);border-radius:12px;padding:3px 10px;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden}
.kall i{border-color:var(--ink)}.kall b{min-width:24px}
.kbt{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.kres.big .kpod{display:none}.kres.big .kres-in{max-width:none;min-height:calc(100vh - 32px)}
.kres.big .kall{max-height:none;font-size:clamp(28px,4vw,48px);grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.kres.big .kall i{width:26px;height:26px}
@media(max-width:800px){.kmini{width:200px;height:127px}.kbtns{top:146px}.kboard{grid-template-columns:150px}.kboard .kr{font-size:15px}}
</style></head><body><div class="wrap" id="app"></div>
<script>
const Q=[
{t:"지체",q:"서기·걷기 같은 이동 기능을 맡는 지체 부위는?",o:["체간 (몸통)","상지 (팔)","하지 (다리)","두부 (머리)"],a:2,e:"하지(다리)예요. 체간은 몸을 세우고 지탱하고, 상지는 먹기·쓰기·잡기 같은 작업을 해요."},
{t:"OX",q:"2001년 장애인복지법 시행규칙 개정 이후, 뇌성마비는 ‘지체장애’에 포함된다.",o:["O","X"],ox:1,a:1,e:"X! 뇌성마비는 뇌병변장애에 포함돼요. 지체장애는 절단, 관절장애, 지체 기능장애, 변형 등이에요."},
{t:"법·제도",q:"2019년 7월 장애등급제 폐지 이후 장애인을 구분하는 방식은?",o:["1~6급","1~3급","장애 정도가 ‘심한 / 심하지 않은’","경도·중등도·중도·최중도"],a:2,e:"1~6급 대신 ‘장애 정도가 심한 / 심하지 않은’ 장애인으로 구분해요."},
{t:"근위축증",q:"듀센형 진행성 근위축증에 대한 설명으로 옳은 것은?",o:["디스트로핀 단백질이 부족하고 주로 남아에게 나타난다","폴리오 바이러스 감염으로 생긴다","주로 여아에게 나타나는 MECP2 돌연변이다","뇌 손상이 더 진행하지 않는다"],a:0,e:"X염색체 열성 유전이라 주로 남아에게 나타나요. 2.5세쯤 증상, 10~12세쯤 걷기가 어려워지고 이후 호흡·심장 관리가 중요해요."},
{t:"OX",q:"소아마비(척수성)는 폴리오 바이러스가 원인이며, 예방접종으로 막을 수 있다.",o:["O","X"],ox:1,a:0,e:"O! 오염된 물·음식(구강-분변 경로)으로 전파돼요. 우리나라가 속한 WHO 서태평양 지역은 2000년에 폴리오 퇴치 인증을 받았어요."},

const RW=480,RH=2640,RR=11,FY=2540;let race=null;
function topTies(){const D=tData.filter(p=>p.d);if(!D.length)return tData.map(p=>p.n);
  const mx=Math.max(...D.map(p=>p.s||0));return D.filter(p=>(p.s||0)===mx).map(p=>p.n)}
function raceStop(){if(race){cancelAnimationFrame(race.raf);race=null}}

function raceCourse(){const S=[],P=[],SP=[],seg=(a,b,c,d)=>S.push([a,b,c,d]);
seg(0,-300,0,RH);seg(RW,-300,RW,RH);
const pegRow=(y,odd,r)=>{if(odd){for(let x=30;x<=450;x+=60)P.push([x,y,r])}else{for(let x=0;x<=RW;x+=60)P.push([x,y,r])}};
for(let r=0,y=230;y<=870;r++,y+=58)pegRow(y,r%2,7);
SP.push({x:130,y:1010,l:150,w:1.7,a:0},{x:350,y:1010,l:150,w:-1.7,a:.8},{x:240,y:1200,l:210,w:1.25,a:0});
P.push([240,1010,9],[40,1200,9],[440,1200,9],[130,1110,8],[350,1110,8]);
seg(0,1380,320,1450);seg(RW,1530,160,1600);seg(0,1680,320,1750);seg(RW,1830,160,1900);
P.push([400,1475,8],[80,1625,8],[400,1775,8],[80,1925,8]);
for(let r=0,y=1980;y<=2320;r++,y+=48){const odd=r%2;for(let x=odd?30:0;x<=(odd?450:RW);x+=60){if(Math.hypot(x-240,y-2150)<88)continue;P.push([x,y,6])}}
SP.push({x:240,y:2150,l:120,w:2.3,a:0});
seg(0,2370,RW/2-37,2480);seg(RW,2370,RW/2+37,2480);
return {S,P,SP}}

function rBounce(m,nx,ny,svx,svy,e){const vn=(m.vx-svx)*nx+(m.vy-svy)*ny;if(vn>=0)return;
m.vx-=(1+e)*vn*nx;m.vy-=(1+e)*vn*ny;const tx=-ny,ty=nx,vt=(m.vx-svx)*tx+(m.vy-svy)*ty;m.vx-=vt*.015*tx;m.vy-=vt*.015*ty}
function rCirc(m,cx,cy,r){const dx=m.x-cx,dy=m.y-cy,d=Math.hypot(dx,dy),R=r+RR;if(d>=R||d===0)return;
const nx=dx/d,ny=dy/d;m.x=cx+nx*R;m.y=cy+ny*R;rBounce(m,nx,ny,0,0,.55)}
function rSeg(m,x1,y1,x2,y2,cx,cy,w,th){const ex=x2-x1,ey=y2-y1,L2=ex*ex+ey*ey;let t=((m.x-x1)*ex+(m.y-y1)*ey)/L2;t=t<0?0:t>1?1:t;
const px=x1+ex*t,py=y1+ey*t,dx=m.x-px,dy=m.y-py,d=Math.hypot(dx,dy),R=RR+th;if(d>=R)return;
let nx,ny;if(d>1e-6){nx=dx/d;ny=dy/d}else{const L=Math.sqrt(L2);nx=-ey/L;ny=ex/L}
m.x=px+nx*R;m.y=py+ny*R;rBounce(m,nx,ny,-w*(py-cy),w*(px-cx),.4)}
function rStep(R,h){const {ms,C}=R;for(const s of C.SP)s.a+=s.w*h;
for(const m of ms){if(m.f)continue;m.vy+=900*h;m.x+=m.vx*h;m.y+=m.vy*h;
  for(const s of C.S)rSeg(m,s[0],s[1],s[2],s[3],0,0,0,2);
  for(const p of C.P)if(Math.abs(p[1]-m.y)<30)rCirc(m,p[0],p[1],p[2]);
  for(const s of C.SP){if(Math.abs(s.y-m.y)>s.l)continue;const c=Math.cos(s.a)*s.l/2,d=Math.sin(s.a)*s.l/2;rSeg(m,s.x-c,s.y-d,s.x+c,s.y+d,s.x,s.y,s.w,5)}
  const sp=Math.hypot(m.vx,m.vy);if(sp>900){m.vx*=900/sp;m.vy*=900/sp}
  if(sp<25){m.st+=h;if(m.st>1.2){m.vy=-280;m.vx=(Math.random()-.5)*320;m.st=0}}else m.st=0;
  if(m.y>FY){m.f=true;R.fin.push(m);rFinish(R,m)}}
for(let a=0;a<ms.length;a++){const A=ms[a];if(A.f)continue;for(let b=a+1;b<ms.length;b++){const B=ms[b];if(B.f)continue;
  const dx=B.x-A.x,dy=B.y-A.y,d2=dx*dx+dy*dy;if(d2>=4*RR*RR||d2===0)continue;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(2*RR-d)/2;A.x-=nx*ov;A.y-=ny*ov;B.x+=nx*ov;B.y+=ny*ov;
  const rv=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;if(rv<0){const j=-1.6*rv/2;A.vx-=j*nx;A.vy-=j*ny;B.vx+=j*nx;B.vy+=j*ny}}}}

function rFinish(R,m){const MD=['🥇','🥈','🥉'],k=R.fin.length;
const li=document.createElement('li');li.innerHTML=`<span style="color:${m.c}">●</span> ${MD[k-1]||''} ${esc(m.n)}`;const l=$('#rlst');if(l)l.appendChild(li);
const c=$('#rcnt');if(c)c.textContent=`${k} / ${R.ms.length} 도착`;
if(k===1){const w=$('#rwin');if(w){w.innerHTML=`🏆 1등 <b>${esc(m.n)}</b>`;w.classList.add('show')}for(let n=0;n<4;n++)setTimeout(confetti,n*300)}
if(k===R.ms.length)R.phase='done'}

function rDraw(R){const {cv,ctx,C,ms}=R,dpr=window.devicePixelRatio||1,cw=cv.clientWidth,ch=cv.clientHeight;if(!cw||!ch)return;
if(cv.width!==Math.round(cw*dpr)||cv.height!==Math.round(ch*dpr)){cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr)}
const sc=cw/RW,vh=ch/sc;let lead=null;for(const m of ms)if(!m.f&&(!lead||m.y>lead.y))lead=m;
const tgt=Math.max(-30,Math.min(RH-vh,(lead?lead.y:RH)-vh*.45));R.cam+=(tgt-R.cam)*(R.phase==='count'?1:.08);
ctx.setTransform(dpr*sc,0,0,dpr*sc,0,-R.cam*dpr*sc);ctx.fillStyle='#fffdf5';ctx.fillRect(0,R.cam,RW,vh);
for(let x=0;x<RW;x+=16){const o=(x/16)%2;ctx.fillStyle=o?'#4a3b52':'#fff';ctx.fillRect(x,FY,16,8);ctx.fillStyle=o?'#fff':'#4a3b52';ctx.fillRect(x,FY+8,16,8)}
ctx.lineCap='round';ctx.strokeStyle='#4a3b52';ctx.lineWidth=4;for(const s of C.S){ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.lineTo(s[2],s[3]);ctx.stroke()}
ctx.lineWidth=2;for(const p of C.P){ctx.beginPath();ctx.arc(p[0],p[1],p[2],0,7);ctx.fillStyle='#ff8fab';ctx.fill();ctx.stroke()}
for(const s of C.SP){const c=Math.cos(s.a)*s.l/2,d=Math.sin(s.a)*s.l/2;ctx.lineWidth=14;ctx.strokeStyle='#4a3b52';ctx.beginPath();ctx.moveTo(s.x-c,s.y-d);ctx.lineTo(s.x+c,s.y+d);ctx.stroke();
  ctx.lineWidth=8;ctx.strokeStyle='#f7b731';ctx.stroke();ctx.beginPath();ctx.arc(s.x,s.y,5,0,7);ctx.fillStyle='#4a3b52';ctx.fill()}
ctx.font="15px Jua, 'Malgun Gothic', sans-serif";ctx.textAlign='center';ctx.lineJoin='round';
for(const m of ms){if(m.f)continue;ctx.beginPath();ctx.arc(m.x,m.y,RR,0,7);ctx.fillStyle=m.c;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#4a3b52';ctx.stroke();
  const lb=(m===lead&&R.phase==='run'?'👑 ':'')+m.n;ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.strokeText(lb,m.x,m.y-RR-5);ctx.fillStyle='#4a3b52';ctx.fillText(lb,m.x,m.y-RR-5)}
ctx.setTransform(dpr,0,0,dpr,0,0);
if(R.phase==='count'){const n=Math.ceil(R.cd);ctx.font=`${Math.min(cw,ch)*.28}px Jua, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=10;ctx.strokeStyle='#fff';ctx.strokeText(n,cw/2,ch/2);ctx.fillStyle='#ff8fab';ctx.fillText(n,cw/2,ch/2);ctx.textBaseline='alphabetic'}
const pg=Math.max(0,Math.min(1,(lead?lead.y:FY)/FY));ctx.fillStyle='rgba(74,59,82,.15)';ctx.fillRect(cw-8,0,8,ch);ctx.fillStyle='#4cc38a';ctx.fillRect(cw-8,0,8,ch*pg)}

function raceRun(ns){const o=$('#rov');if(!o)return;raceStop();o.onclick=null;
o.innerHTML=`<div class="card race"><div class="row"><h2 style="margin:0">🎱 구슬 레이스</h2><span class="tag" id="rcnt" style="margin:0">0 / ${ns.length} 도착</span></div>

<div style="margin-top:14px"><button class="btn sm" id="rre">🔁 다시 달리기</button> <button class="btn sm alt" id="red">✏️ 방식·이름 바꾸기</button> <button class="btn sm alt" id="rcl">닫기</button></div></div>`;

const cols=Math.min(sh.length,15),gap=(RW-60)/cols;
const ms=sh.map((n,k)=>({n,x:30+gap*((k%cols)+.5)+(Math.random()-.5)*4,y:40+Math.floor(k/cols)*28,vx:(Math.random()-.5)*30,vy:0,st:0,f:false,c:`hsl(${Math.round(k*360/sh.length)},85%,68%)`}));
const cv=$('#rcv'),R={cv,ctx:cv.getContext('2d'),C:raceCourse(),ms,fin:[],cam:-30,phase:'count',cd:3,last:0,raf:0,t:0};race=R;window.__race=R;
const loop=ts=>{if(race!==R||!document.body.contains(cv))return;const dt=R.last?Math.min(.033,(ts-R.last)/1000):0;R.last=ts;
  if(R.phase==='count'){R.cd-=dt;if(R.cd<=0)R.phase='run'}
  else if(R.phase==='run'){R.t+=dt;for(let k=0;k<6;k++)rStep(R,dt/6)}
  rDraw(R);if(R.phase!=='done')R.raf=requestAnimationFrame(loop)};
R.raf=requestAnimationFrame(loop)}

  else if(K.hold<=0||!K.focus){const act=K.order.filter(k=>!k.fin);
    if(!act.length){K.focus=K.order[0];K.tag='🏁 결승선'}
    else{let best=act[0],gap=1e9;for(let i=0;i<Math.min(act.length-1,6);i++){const g=act[i].s-act[i+1].s;if(g<gap){gap=g;best=act[i+1]}}
      if(gap<7){K.focus=best;K.tag='🔥 접전'}else{K.focus=act[0];K.tag='👑 선두'}}
    K.hold=2.6}
  const k=K.focus,p=kAt(T,k.s),x=p.x-p.tz*k.d,z=p.z+p.tx*k.d;pos=new THREE.Vector3(x-p.tx*10,5,z-p.tz*10);look=new THREE.Vector3(x+p.tx*6,1,z+p.tz*6)}
if(K.focus!==K.lastF){K.lastF=K.focus;K.sw=K.t}const fast=K.view!=='all'&&K.phase!=='count'&&K.t-(K.sw||0)>1.1,a=1-Math.exp(-dt*(K.view==='all'?2.5:fast?9:3.2));K.cp.lerp(pos,a);K.cl.lerp(look,1-Math.exp(-dt*(fast?12:4)));K.cam.position.copy(K.cp);K.cam.lookAt(K.cl)}

function kLabels(K,w,h){const v=K.v3,far=K.view==='all';
for(const k of K.ks){v.set(k.g.position.x,k.g.position.y+2.5,k.g.position.z);const dist=v.distanceTo(K.cam.position);v.project(K.cam);const el=k.lb;
  if(v.z>1||v.x<-1.2||v.x>1.2||v.y<-1.2||v.y>1.2||(!far&&dist>130)){if(el.style.display!=='none')el.style.display='none';continue}
  el.style.display='';el.style.transform=`translate(${((v.x+1)/2*w).toFixed(1)}px,${((1-v.y)/2*h).toFixed(1)}px) translate(-50%,-100%) scale(${far?.75:Math.max(.6,Math.min(1.25,26/dist))})`;
  el.style.zIndex=k===K.focus?5:1}}

function kBoard(K){const ord=K.order||kOrder(K),n=ord.length,U=K.ui;
U.board.className='kboard'+(n>14?' c2':'')+(n>30?' sm':'');U.board.style.gridTemplateRows=n>14?`repeat(${Math.ceil(n/2)},auto)`:'';
U.board.innerHTML=ord.map((k,i)=>`<div class="kr${i===0?' top':''}${k===K.focus&&K.view!=='all'?' foc':''}"><span class="kp">${i+1}</span><i style="background:${k.col}"></i><span class="kn">${esc(k.n)}</span>${k.fin?'🏁':k.item?KITEM[k.item]:''}</div>`).join('');
const ld=ord[0],lap=Math.min(K.laps,Math.floor(Math.max(0,ld.s)/K.T.L)+1);
U.lap.innerHTML=`LAP <b>${lap}</b>/${K.laps}`;U.time.textContent=(K.phase==='count'?0:K.t).toFixed(1)+'초';
if(!K.finalShown&&K.phase==='run'&&ld.s>=(K.laps-1)*K.T.L){K.finalShown=true;U.fin.classList.add('show');setTimeout(()=>U.fin.classList.remove('show'),2300)}
U.cam.innerHTML=K.view==='all'?'🗺️ 전체 보기':`${K.tag||'🎥 중계'} <b>${esc(K.focus?K.focus.n:'')}</b> <small>${K.focus?K.focus.pos+1+'위':''}</small>`;
if(K.evDirty||K.ev.some(e=>K.t-e.t>3.5)){K.ev=K.ev.filter(e=>K.t-e.t<=3.5);K.evDirty=false;U.feed.innerHTML=K.ev.slice(0,3).map(e=>`<div style="background:${e.col}">${e.txt}</div>`).join('')}}

function kMini(K){const c=K.ui.mini,x=c.getContext('2d'),T=K.T,W=c.width,H=c.height,pad=14,sc=Math.min((W-pad*2)/(T.x1-T.x0),(H-pad*2)/(T.z1-T.z0)),
ox=(W-(T.x1-T.x0)*sc)/2,oz=(H-(T.z1-T.z0)*sc)/2,P=(px,pz)=>[ox+(px-T.x0)*sc,oz+(pz-T.z0)*sc];
x.clearRect(0,0,W,H);x.lineJoin='round';x.beginPath();for(let i=0;i<=T.N;i+=8){const p=P(T.px[i%T.N],T.pz[i%T.N]);i?x.lineTo(...p):x.moveTo(...p)}x.closePath();
x.strokeStyle='#4a3b52';x.lineWidth=11;x.stroke();x.strokeStyle='#fffdf5';x.lineWidth=7;x.stroke();
const s0=P(T.px[0],T.pz[0]);x.fillStyle='#4a3b52';x.fillRect(s0[0]-1.5,s0[1]-7,3,14);
for(const k of [...K.ks].reverse()){const p=kAt(T,k.s),q=P(p.x,p.z),big=k===K.focus||k.pos===0;x.beginPath();x.arc(q[0],q[1],big?6:4,0,7);x.fillStyle=k.col;x.fill();x.lineWidth=big?2.5:1.2;x.strokeStyle='#222';x.stroke()}}

function kResults(K){const ord=kOrder(K),U=K.ui,MD=['🥇','🥈','🥉'];K.resShown=true;kFanfare();for(let n=0;n<4;n++)setTimeout(confetti,n*300);
const pod=[1,0,2].filter(i=>ord[i]).map(i=>`<div class="kpd p${i+1}"><div class="kpn"><i style="background:${ord[i].col}"></i>${esc(ord[i].n)}</div><div class="kpb">${MD[i]}<b>${i+1}</b></div></div>`).join('');
U.res.innerHTML=`<div class="kres-in"><h2>🏁 경기 결과 <small>${K.laps}바퀴 · ${(ord[ord.length-1].ft||K.t).toFixed(1)}초</small></h2><div class="kpod">${pod}</div>
<ol class="kall">${ord.map((k,i)=>`<li><b>${i+1}</b><i style="background:${k.col}"></i>${esc(k.n)}</li>`).join('')}</ol>
<div class="kbt"><button class="btn sm" id="kbig">🔠 전체 큰 글씨로 보기</button><button class="btn sm" id="kagain" style="background:var(--mint)">🔁 다시 경기</button><button class="btn sm alt" id="kchg">✏️ 방식·이름 바꾸기</button><button class="btn sm alt" id="kcls">닫기</button></div></div>`;
U.res.classList.add('show');
$('#kbig').onclick=()=>{U.res.classList.toggle('big');$('#kbig').textContent=U.res.classList.contains('big')?'↩ 시상대로 돌아가기':'🔠 전체 큰 글씨로 보기'};
$('#kagain').onclick=()=>kartRun(K.ns);$('#kchg').onclick=()=>kartBack(K.ns);$('#kcls').onclick=raceClose}

function kartClose(){if(kart){cancelAnimationFrame(kart.raf);window.removeEventListener('keydown',kart.key);try{kart.S&&kart.S.traverse(o=>{if(o.geometry)o.geometry.dispose();const m=o.material;(Array.isArray(m)?m:m?[m]:[]).forEach(x=>{if(x.map)x.map.dispose();x.dispose()})});kart.R&&kart.R.dispose()}catch(e){}kart=null}
const o=$('#kov');if(o)o.remove();document.documentElement.style.overflow=''}
function kartBack(ns){kartClose();const o=$('#rov');if(o){o.style.display='';raceSetup(ns)}}

async function kartRun(ns){kartClose();const ro=$('#rov');if(ro)ro.style.display='none';kSnd('none');
document.documentElement.style.overflow='hidden';const ov=document.createElement('div');ov.className='kov';ov.id='kov';ov.innerHTML='<div class="kload">🏎️ 서킷 준비 중...</div>';document.body.appendChild(ov);
try{await loadThree()}catch(e){if(!$('#kov'))return;ov.innerHTML=`<div class="kload">⚠️ 3D 화면을 불러오지 못했어요.<br><small>인터넷 연결을 확인하거나 구슬 레이스를 써 주세요.</small><br><button class="btn" id="kbk">돌아가기</button></div>`;$('#kbk').onclick=()=>kartBack(ns);return}
if(!$('#kov'))return;
ov.innerHTML=`<canvas id="kcv"></canvas><div id="klbs"></div><div class="kflash" id="kfl"></div>
<div class="kboard" id="kbd"></div><div class="ktop"><div class="kpill" id="klap"></div><div class="kpill" id="ktm"></div></div>
<div class="kfeed" id="kfd"></div><canvas class="kmini" id="kmn" width="300" height="190"></canvas>
<div class="kbtns"><button id="kau" class="on">🎥 자동 중계</button><button id="kal">🗺️ 전체 보기</button><button id="ksd"></button><button id="kx">✖ 닫기</button></div>
<div class="kcam" id="kcm"></div><div class="klight" id="klt"><i></i><i></i><i></i><span></span></div><div class="kfinal" id="kfn">FINAL LAP</div><div class="kres" id="krs"></div>`;
const T=kTrack(),v0=T.L/12,cols=ns.length<=6?2:ns.length<=16?3:4,gap=Math.min(3,(KW-3)/(cols-1));
const grid=ns.map((_,i)=>i);for(let i=grid.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[grid[i],grid[j]]=[grid[j],grid[i]]}
const ks=ns.map((n,i)=>{const g=grid.indexOf(i),r=Math.floor(g/cols),c=g%cols;return {id:i,n,col:kColor(i),s:-3-r*3.3-(c%2)*1.3,d:(c-(cols-1)/2)*gap,v:0,bs:v0*(.985+Math.random()*.03),nz:0,tgt:0,lt:1.5+Math.random(),slip:0,stop:0,hit:0,boost:0,shield:0,zap:0,spin:0,item:null,useAt:0,fin:false,ft:0,pos:0}});
ks.forEach(k=>k.tgt=k.d);
const K={ns,ks,T,v0,laps:+KS.get('laps',3)||3,q:KS.get('q','mid'),cv:$('#kcv'),phase:'count',cd:3.6,lv:-1,t:0,acc:0,last:0,uiT:0,view:'auto',hold:0,tag:'',focus:null,major:null,ev:[],fin:[],hz:[],rk:[],flash:0,finalShown:false,raf:0};
K.ui={board:$('#kbd'),lap:$('#klap'),time:$('#ktm'),feed:$('#kfd'),mini:$('#kmn'),cam:$('#kcm'),light:$('#klt'),fin:$('#kfn'),res:$('#krs'),flash:$('#kfl')};
try{kBuild(K)}catch(e){console.error(e);ov.innerHTML=`<div class="kload">⚠️ 이 컴퓨터에서 3D 화면을 켤 수 없어요.<br><small>화질을 '가벼움'으로 바꾸거나 구슬 레이스를 써 주세요.</small><br><button class="btn" id="kbk">돌아가기</button></div>`;$('#kbk').onclick=()=>kartBack(ns);return}
kart=K;K.order=kOrder(K);K.focus=K.order[0];
const lbs=$('#klbs');ks.forEach(k=>{const d=document.createElement('div');d.className='klb';d.innerHTML=`<i style="background:${k.col}"></i>${esc(k.n)}`;lbs.appendChild(d);k.lb=d});
const setView=v=>{K.view=v;$('#kau').classList.toggle('on',v==='auto');$('#kal').classList.toggle('on',v==='all')};
$('#kau').onclick=()=>setView('auto');$('#kal').onclick=()=>setView('all');$('#kx').onclick=raceClose;
const sdl=()=>{$('#ksd').textContent=KS.get('snd',true)?'🔊 소리 켬':'🔇 소리 끔'};sdl();$('#ksd').onclick=()=>{KS.set('snd',!KS.get('snd',true));sdl()};
K.key=e=>{if(e.key==='Escape')raceClose()};window.addEventListener('keydown',K.key);
const loop=ts=>{if(kart!==K)return;const dt=K.last?Math.min(.05,(ts-K.last)/1000):0;K.last=ts;
  const cv=K.cv,w=cv.clientWidth,h=cv.clientHeight;if(w&&h&&(K.w!==w||K.h!==h)){K.w=w;K.h=h;K.R.setSize(w,h,false);K.cam.aspect=w/h;K.cam.updateProjectionMatrix()}
  if(K.phase==='count'){K.cd-=dt;const lv=K.cd>3?0:K.cd>2?1:K.cd>1?2:K.cd>0?3:4;
    if(lv!==K.lv){K.lv=lv;const L=K.ui.light;L.className='klight l'+lv;L.querySelector('span').textContent=lv===4?'GO!':lv?String(4-lv):'';if(lv)kSnd(lv===4?'go':'cd')}
    if(K.cd<=0){K.phase='run';setTimeout(()=>{if(kart===K)K.ui.light.className='klight off'},900)}}
  else{K.acc+=dt;let n=0;while(K.acc>=KDT&&n<6){kStep(K,KDT);K.acc-=KDT;n++}if(n===6)K.acc=0}
  if(K.phase==='done'&&!K.resShown&&K.t>=K.resAt)kResults(K);
  kVisual(K,dt);kCam(K,dt);K.R.render(K.S,K.cam);kLabels(K,w,h);
  if(ts-K.uiT>180){K.uiT=ts;kBoard(K);kMini(K)}
  K.raf=requestAnimationFrame(loop)};
K.raf=requestAnimationFrame(loop)}

home();
</script>
