<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>자폐범주장애 쑥쑥 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--pink:#ffd6e0;--pink2:#ff8fab;--mint:#d4f5e4;--mint2:#4cc38a;--yel:#fff3bf;--yel2:#f7b731;--sky:#d6ecff;--ink:#4a3b52;--bg:#fff8f0;--card:#fff;--bad:#ff6b6b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background-image:radial-gradient(var(--pink) 2px,transparent 2px),radial-gradient(var(--sky) 2px,transparent 2px);background-size:36px 36px;background-position:0 0,18px 18px}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 40px}
.wrap.wide{max-width:1240px}
.card{background:var(--card);border:4px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:26px 24px}
h1{margin:0;font-size:clamp(30px,6vw,52px);text-align:center;line-height:1.25}
h2{font-size:clamp(22px,3.4vw,30px)}h3{margin:22px 0 10px;font-size:22px;font-weight:normal}
.mascot{font-size:clamp(70px,14vw,120px);text-align:center;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(4deg)}}
.sub{text-align:center;font-size:clamp(18px,3vw,24px);margin:8px 0 22px}
.btn{font-family:inherit;font-size:clamp(20px,3.4vw,28px);background:var(--yel2);color:var(--ink);border:4px solid var(--ink);border-radius:999px;padding:12px 34px;cursor:pointer;box-shadow:0 6px 0 var(--ink);transition:.08s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.6;cursor:default}
.btn.sm{font-size:18px;padding:6px 16px;border-width:3px;box-shadow:0 4px 0 var(--ink)}
.btn.alt{background:var(--sky)}.btn.red{background:var(--pink2)}
.center{text-align:center}
.inp{font-family:inherit;font-size:26px;color:var(--ink);border:4px solid var(--ink);border-radius:18px;padding:10px 16px;width:100%;max-width:380px;text-align:center;outline:none}
.inp:focus{background:var(--yel)}
.link{background:none;border:none;font-family:inherit;color:var(--ink);opacity:.55;text-decoration:underline;cursor:pointer;font-size:16px;margin-top:22px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:clamp(18px,3vw,24px)}
.bar{flex:1;height:22px;background:#fff;border:3px solid var(--ink);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink2),var(--yel2));transition:width .4s}
.score{background:var(--yel);border:3px solid var(--ink);border-radius:999px;padding:2px 14px}
.tag{display:inline-block;background:var(--sky);border:3px solid var(--ink);border-radius:999px;padding:2px 14px;font-size:clamp(15px,2.4vw,20px);margin-bottom:10px}
.q{font-size:clamp(24px,4.4vw,38px);line-height:1.4;margin:6px 0 20px;word-break:keep-all}
.opts{display:grid;gap:14px}
.opt{font-family:inherit;text-align:left;font-size:clamp(20px,3.4vw,30px);line-height:1.35;color:var(--ink);background:var(--pink);border:4px solid var(--ink);border-radius:22px;padding:14px 18px;cursor:pointer;box-shadow:0 6px 0 var(--ink);display:flex;gap:14px;align-items:center;word-break:keep-all;transition:.08s}
.opt:nth-child(2){background:var(--mint)}.opt:nth-child(3){background:var(--yel)}.opt:nth-child(4){background:var(--sky)}
.opt:hover:not(:disabled){transform:translateY(-3px)}
.opt:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.opt .n{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-size:26px}
.opt:disabled{cursor:default}
.opt.right{background:var(--mint2)!important;animation:pop .5s}
.opt.wrong{background:var(--bad)!important;animation:shake .4s;color:#fff}
.opt.dim{opacity:.45}
.ox{grid-template-columns:1fr 1fr}.ox .opt{justify-content:center;font-size:clamp(34px,7vw,64px);padding:22px}
@keyframes pop{40%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.fb{margin-top:20px;border:4px dashed var(--ink);border-radius:22px;padding:14px 18px;background:#fffdf5;font-size:clamp(18px,3vw,26px);line-height:1.5;display:none;word-break:keep-all}
.fb.show{display:block;animation:pop .4s}
.fb b{font-size:1.15em}
.next{margin-top:20px;display:none;text-align:right}.next.show{display:block}
.hint{text-align:center;margin-top:16px;font-size:16px;opacity:.7}
.big{font-size:clamp(54px,12vw,110px);text-align:center;line-height:1.1}
.res{font-size:clamp(22px,4vw,34px);text-align:center;margin:10px 0 20px}
.wrongs{margin:16px 0 0;padding:0;list-style:none;font-size:clamp(16px,2.6vw,22px);text-align:left}
.wrongs li{background:var(--pink);border:3px solid var(--ink);border-radius:14px;padding:8px 12px;margin-bottom:8px}
.conf{position:fixed;top:-20px;font-size:28px;pointer-events:none;animation:fall 1.6s linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
/* 교사 대시보드 */
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0 0}
.stat{background:var(--yel);border:3px solid var(--ink);border-radius:18px;padding:10px;text-align:center;font-size:18px}
.stat:nth-child(2){background:var(--mint)}.stat:nth-child(3){background:var(--pink)}.stat:nth-child(4){background:var(--sky)}
.stat b{display:block;font-size:40px;font-weight:normal}
.qbars{display:grid;gap:6px}
.qb{display:grid;grid-template-columns:48px 1fr 110px;gap:10px;align-items:center;cursor:pointer;font-size:18px;padding:3px 8px;border-radius:12px}
.qb:hover,.qb.sel{background:var(--yel)}
.qb.low .bar>i{background:var(--bad)}
.qb .bar{height:20px}
.dr{display:grid;grid-template-columns:1fr minmax(100px,220px) 54px;gap:10px;align-items:center;margin-top:8px;font-size:.85em}
.dr.ok{color:#1e7a4f}.dr .bar{height:16px}.dr.ok .bar>i{background:var(--mint2)}
.tbl{overflow:auto;max-height:62vh;border:3px solid var(--ink);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:17px}
th,td{border:1.5px solid #c9bfd0;padding:5px 6px;text-align:center}
th{background:var(--sky);position:sticky;top:0;z-index:1}
td.nm{text-align:left;white-space:nowrap}
td.c-ok{background:var(--mint)}td.c-no{background:#ffd3d3}
.wait{font-size:22px;padding:30px 10px}
.live{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--mint2);margin-right:6px;animation:blink 1s infinite;vertical-align:middle}
@keyframes blink{50%{opacity:.2}}
.ov{position:fixed;inset:0;background:rgba(74,59,82,.6);display:grid;place-items:center;z-index:20;padding:16px}
.ov .card{max-width:760px;width:100%;text-align:center;max-height:96vh;overflow:auto}
#qr{display:inline-block;background:#fff;padding:16px;border:4px solid var(--ink);border-radius:20px;margin:14px 0}
#qr img,#qr canvas{display:block;width:min(58vh,70vw);height:auto}
td.tm{white-space:nowrap;font-size:15px}
/* 구슬 레이스 */
.conf{z-index:40}
.ov .card.race{max-width:1100px;padding:18px}
.rbox{display:flex;gap:12px;margin-top:10px;align-items:stretch}
.rcw{position:relative;flex:1;min-width:0}
#rcv{display:block;width:100%;height:min(68vh,760px);border:4px solid var(--ink);border-radius:18px;background:#fffdf5}
.rlist{width:200px;margin:0;padding:8px 10px 8px 36px;border:3px solid var(--ink);border-radius:16px;background:#fff;text-align:left;font-size:18px;overflow:auto;max-height:min(68vh,760px)}
.rlist li{margin:3px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rwin{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--yel);border:4px solid var(--ink);border-radius:20px;padding:6px 24px;font-size:clamp(26px,5vw,46px);display:none;white-space:nowrap;box-shadow:0 6px 0 var(--ink);z-index:2}
.rwin.show{display:block;animation:pop .6s}
@media(max-width:700px){.rbox{flex-direction:column}.rlist{width:auto;max-height:120px}}
</style></head><body><div class="wrap" id="app"></div>
<script>
const Q=[
{t:"용어",q:"1943년 11명의 아동을 관찰한 보고서를 발표하고 ‘유아자폐증(Early Infantile Autism)’이라고 이름 붙인 사람은?",o:["Bleuler","Kanner","Asperger","Bettelheim"],a:1,e:"Kanner(1943)예요. Bleuler(1911)는 조현병 증상을 설명하며 ‘autism’이라는 말을 처음 썼고, Asperger(1944)는 언어·인지가 비교적 양호한 아동을 보고했어요."},
{t:"OX",q:"자폐는 부모의 차갑고 거부적인 양육 태도에서 비롯된다(‘냉장고 엄마’ 이론).",o:["O","X"],ox:1,a:1,e:"X! Bettelheim(1956)의 잘못된 주장이에요. Rimland(1964)가 반박했고, 현재는 유전적·신경학적 요인으로 봐요."},
{t:"용어",q:"Kanner의 자폐와 아스퍼거 증후군이 하나의 연속선 위에 있음을 밝혀 ‘스펙트럼’ 개념의 토대를 만든 사람은?",o:["Rimland","Bettelheim","Lorna Wing","Bleuler"],a:2,e:"Lorna Wing(1981)이에요. 자폐 딸을 둔 영국 정신과 의사로, 잊혀 있던 Asperger의 논문을 다시 찾아냈어요."},
{t:"진단기준 A",q:"DSM-5-TR 진단기준 A(사회적 의사소통·상호작용 결함)의 하위 항목은 몇 개가 충족되어야 할까?",o:["1개 이상","2개 이상","4개 중 2개","3개 모두"],a:3,e:"A.1 사회-감정적 상호성, A.2 비언어적 의사소통, A.3 관계 발전·유지·이해 — 세 항목 모두에서 결함이 확인되어야 해요(현재 또는 과거력)."},
{t:"OX",q:"DSM-5-TR 진단기준 B(제한적·반복적 행동·흥미·활동)는 4개 항목 중 2가지 이상이 나타나야 한다.",o:["O","X"],ox:1,a:0,e:"O! A는 ‘3개 모두’, B는 ‘4개 중 2개 이상’이에요. 헷갈리기 쉬우니 짝지어 외워 두세요."},
{t:"진단기준 B",q:"진단기준 B 중 DSM-5에서 새로 들어온 항목은?",o:["상동적·반복적 운동, 물건 사용, 말하기","동일성 고집과 의례적 행동","강도나 초점이 비정상적인 고정된 흥미","감각 정보에 대한 과잉 또는 과소 반응"],a:3,e:"B.4 감각 항목이 DSM-5에서 새로 들어왔어요. 치료실에서 가장 먼저 눈에 띄는 단서이기도 해요."},
{t:"진단기준 B",q:"어제 TV에서 들은 “콩순이 팝콘 시작!”을 오늘 블록 놀이 중 뜬금없이 반복한다. 무엇에 해당할까?",o:["반향어 (B.1)","의례적 인사 (B.2)","감각 추구 (B.4)","상징놀이"],a:0,e:"과거에 들었던 말을 뒤늦게 그대로 반복하는 반향어로, B.1(상동적·반복적 말하기)에 속해요."},
{t:"진단기준 B",q:"늘 가던 길이 공사로 막혀 다른 길로 가자 아이가 심하게 울며 힘들어한다. 해당하는 항목은?",o:["B.1 상동적·반복적 운동","B.2 동일성에 대한 고집","B.3 극도로 고정된 흥미","B.4 감각에 대한 특이한 반응"],a:1,e:"사소한 변화에 극도의 고통, 같은 길·같은 음식에 대한 요구는 B.2 동일성 고집이에요."},
{t:"OX",q:"언어 손상이 동반되어야 자폐스펙트럼장애로 진단할 수 있다.",o:["O","X"],ox:1,a:1,e:"X! 언어 손상 동반 여부는 진단 기준이 아니라 함께 적는 ‘명시자(specifier)’예요. 지적 손상 동반 여부도 마찬가지예요."},
{t:"감별진단",q:"사회적(화용적) 의사소통장애(SCD)와 자폐스펙트럼장애를 가르는 핵심은?",o:["언어 손상의 유무","지적장애의 유무","제한적·반복적 행동(B 기준)의 유무","증상이 나타난 연령"],a:2,e:"B 기준(제한적·반복적 행동)이 없으면 SCD, 있으면 ASD예요. 현재나 과거력에서 B가 확인되면 SCD로 진단하지 않아요."},
{t:"OX",q:"AAC(보완·대체 의사소통)를 사용하면 말이 늦어지므로, 말이 나올 때까지 사용을 미루는 것이 좋다.",o:["O","X"],ox:1,a:1,e:"X! AAC는 말을 포기하는 것이 아니라 의사소통의 통로를 먼저 열어 주는 것이에요. AAC가 구어 발달을 막지 않는다는 연구가 쌓여 있어요."},
{t:"하위유형",q:"X 염색체의 MECP2 유전자 돌연변이가 원인으로 밝혀져 DSM-5에서 자폐스펙트럼장애에서 제외된 하위유형은?",o:["레트장애","아스퍼거장애","달리 명시되지 않은 PDD","아동기 붕괴성 장애"],a:0,e:"레트장애예요. 주로 여아에게 나타나고, 손의 사용 기능을 잃고 상동적인 손 움직임을 보여요."},
{t:"문제행동 지도",q:"타임아웃(time-out)이 효과를 내기 위한 전제 조건은?",o:["재미없는 활동 중에 사용한다","‘타임인(time-in)’이 풍부해야 한다","나이와 관계없이 30분 이상 실시한다","예고 없이 갑자기 실시한다"],a:1,e:"타임인이 즐거워야 빠지는 게 손해가 돼요. 재미없는 활동 중 타임아웃은 오히려 해방감을 줘 행동이 늘어요. 시간은 연령당 1분이 기준이에요."},
{t:"문제행동 지도",q:"“싫어하는 숙제를 다 하면 축구를 할 수 있게 해 준다.” 어떤 강화일까?",o:["토큰 강화(조건강화)","부적강화","반응대가","활동강화(프리맥 효과)"],a:3,e:"빈도가 높은(좋아하는) 행동으로 빈도가 낮은 행동을 강화하는 활동강화, 즉 프리맥 효과예요."},
{t:"하위유형",q:"달리 명시되지 않은 PDD 중 ‘지적 능력이 비교적 양호하고 타인에게 적극적으로 다가가지만, 눈치 없이 자기 관심사만 일방적으로 말하는’ 집단은?",o:["무관심한 집단","수동적인 집단","적극적이지만 이상한 집단","고립된 집단"],a:2,e:"적극적이지만 이상한 집단이에요. 눈맞춤을 피하지 않고 오히려 너무 빤히 쳐다보기도 해요."},
{t:"원인",q:"자폐스펙트럼장애의 출현율이 높아진 이유로 가장 크게 설명되는 것은?",o:["발견·진단 체계의 변화","부모의 양육 방식 변화","출생아 수의 증가","아동의 스마트폰 사용 증가"],a:0,e:"전문가 인식 향상, 조기 발견 체계 개선, 진단 경계 완화, 진단 도구 발달 등 발견·진단 체계의 변화가 상당 부분을 설명해요."},
{t:"조기 신호",q:"CDC(2014) 시기별 위험 신호 중 ‘가리키기 행동이 없음(사물에 대한 관심을 표현하지 않음)’을 꼭 확인할 시기는?",o:["6개월","12개월","14개월","18개월"],a:2,e:"14개월이에요. 12개월은 이름을 불러도 반응하지 않음, 18개월은 상징놀이를 하지 않음이 핵심 신호예요."},
{t:"의사소통 특성",q:"자폐 아동이 비언어적 의사소통의 한계를 보상하려고 주로 사용하는 ‘도구적 몸짓’은?",o:["가리키기","보여주기","끄덕이기","다른 사람의 손 조작하기"],a:3,e:"성인을 데려가기, 잡아당기기, 다른 사람의 손 조작하기가 도구적 몸짓이에요. 가리키기·보여주기·끄덕이기는 일반 아동이 많이 쓰는 사회적 몸짓이에요."},
{t:"예후",q:"자폐 아동의 예후를 가장 크게 좌우하는 두 가지는?",o:["IQ 50 이상, 언어적 의사소통 가능 여부","성별, 출생 순서","서번트 기술 유무, 진단받은 병원","형제 수, 거주 지역"],a:0,e:"IQ 50 이상과 언어적 의사소통 가능 여부예요. 조기 발견·교육 시기, 총 교육 시간, 사회적 성숙도도 중요한 변인이에요."},

<button class="btn" id="uc">닫기</button><br><button class="link" id="ue">링크 바꾸기</button></div>`;
$('#uc').onclick=()=>o.remove();$('#ue').onclick=()=>{tUrl='';qrDraw()};
if(window.QRCode){new QRCode($('#qr'),{text:tUrl,width:512,height:512,correctLevel:QRCode.CorrectLevel.M})}
else $('#qr').textContent='QR 라이브러리를 불러오지 못했어요. 링크를 직접 공유해 주세요.'}

/* ---------- 🎱 구슬 레이스: 동점자 1등 재미있게 뽑기 ---------- */
const RW=480,RH=2640,RR=11,FY=2540;let race=null;
function topTies(){const D=tData.filter(p=>p.d);if(!D.length)return tData.map(p=>p.n);
  const mx=Math.max(...D.map(p=>p.s||0));return D.filter(p=>(p.s||0)===mx).map(p=>p.n)}
function raceStop(){if(race){cancelAnimationFrame(race.raf);race=null}}
function raceClose(){raceStop();const o=$('#rov');if(o)o.remove()}
function raceOpen(){raceClose();const o=document.createElement('div');o.className='ov';o.id='rov';document.body.appendChild(o);raceSetup()}
function raceSetup(names){const o=$('#rov');if(!o)return;raceStop();
const ties=topTies(),done=tData.filter(p=>p.d).map(p=>p.n),init=names||ties;
o.onclick=e=>{if(e.target===o)raceClose()};
o.innerHTML=`<div class="card"><h2 style="margin-top:0">🎱 구슬 레이스로 1등 뽑기</h2>
<p class="sub" style="margin-bottom:12px">가장 먼저 결승선을 통과한 구슬이 1등!<br><small>이름은 한 줄에 한 명씩 (쉼표로 구분해도 돼요)</small></p>
<textarea class="inp" id="rn" rows="6" style="max-width:100%;font-size:20px;text-align:left;resize:vertical" placeholder="이름을 넣어 주세요">${esc(init.join('\n'))}</textarea>
<div style="margin:12px 0 4px"><button class="btn sm alt" id="rt">🏆 1등 동점자 (${ties.length}명)</button> <button class="btn sm alt" id="ra">🏁 완료한 학생 전체 (${done.length}명)</button></div>
<p class="hint" id="rm" style="margin-top:6px"></p>
<div><button class="btn" id="rg">출발! ▶</button> <button class="btn alt" id="rc">닫기</button></div></div>`;
$('#rt').onclick=()=>{$('#rn').value=ties.join('\n')};$('#ra').onclick=()=>{$('#rn').value=done.join('\n')};$('#rc').onclick=raceClose;
$('#rg').onclick=()=>{const ns=$('#rn').value.split(/[\n,]/).map(s=>s.trim()).filter(Boolean).slice(0,60);
  if(ns.length<2){$('#rm').textContent='⚠️ 이름을 2명 이상 넣어 주세요!';return}raceRun(ns)}}

function raceCourse(){const S=[],P=[],SP=[],seg=(a,b,c,d)=>S.push([a,b,c,d]);
seg(0,-300,0,RH);seg(RW,-300,RW,RH);
const pegRow=(y,odd,r)=>{if(odd){for(let x=30;x<=450;x+=60)P.push([x,y,r])}else{for(let x=0;x<=RW;x+=60)P.push([x,y,r])}};
for(let r=0,y=230;y<=870;r++,y+=58)pegRow(y,r%2,7);
SP.push({x:130,y:1010,l:150,w:1.7,a:0},{x:350,y:1010,l:150,w:-1.7,a:.8},{x:240,y:1200,l:210,w:1.25,a:0});
P.push([240,1010,9],[40,1200,9],[440,1200,9],[130,1110,8],[350,1110,8]);
seg(0,1380,320,1450);seg(RW,1530,160,1600);seg(0,1680,320,1750);seg(RW,1830,160,1900);
P.push([400,1475,8],[80,1625,8],[400,1775,8],[80,1925,8]);
for(let r=0,y=1980;y<=2320;r++,y+=48){const odd=r%2;for(let x=odd?30:0;x<=(odd?450:RW);x+=60){if(Math.hypot(x-240,y-2150)<88)continue;P.push([x,y,6])}}
SP.push({x:240,y:2150,l:120,w:2.3,a:0});
seg(0,2370,RW/2-37,2480);seg(RW,2370,RW/2+37,2480);
return {S,P,SP}}

function rBounce(m,nx,ny,svx,svy,e){const vn=(m.vx-svx)*nx+(m.vy-svy)*ny;if(vn>=0)return;
m.vx-=(1+e)*vn*nx;m.vy-=(1+e)*vn*ny;const tx=-ny,ty=nx,vt=(m.vx-svx)*tx+(m.vy-svy)*ty;m.vx-=vt*.015*tx;m.vy-=vt*.015*ty}
function rCirc(m,cx,cy,r){const dx=m.x-cx,dy=m.y-cy,d=Math.hypot(dx,dy),R=r+RR;if(d>=R||d===0)return;
const nx=dx/d,ny=dy/d;m.x=cx+nx*R;m.y=cy+ny*R;rBounce(m,nx,ny,0,0,.55)}
function rSeg(m,x1,y1,x2,y2,cx,cy,w,th){const ex=x2-x1,ey=y2-y1,L2=ex*ex+ey*ey;let t=((m.x-x1)*ex+(m.y-y1)*ey)/L2;t=t<0?0:t>1?1:t;
const px=x1+ex*t,py=y1+ey*t,dx=m.x-px,dy=m.y-py,d=Math.hypot(dx,dy),R=RR+th;if(d>=R)return;
let nx,ny;if(d>1e-6){nx=dx/d;ny=dy/d}else{const L=Math.sqrt(L2);nx=-ey/L;ny=ex/L}
m.x=px+nx*R;m.y=py+ny*R;rBounce(m,nx,ny,-w*(py-cy),w*(px-cx),.4)}
function rStep(R,h){const {ms,C}=R;for(const s of C.SP)s.a+=s.w*h;
for(const m of ms){if(m.f)continue;m.vy+=900*h;m.x+=m.vx*h;m.y+=m.vy*h;
  for(const s of C.S)rSeg(m,s[0],s[1],s[2],s[3],0,0,0,2);
  for(const p of C.P)if(Math.abs(p[1]-m.y)<30)rCirc(m,p[0],p[1],p[2]);
  for(const s of C.SP){if(Math.abs(s.y-m.y)>s.l)continue;const c=Math.cos(s.a)*s.l/2,d=Math.sin(s.a)*s.l/2;rSeg(m,s.x-c,s.y-d,s.x+c,s.y+d,s.x,s.y,s.w,5)}
  const sp=Math.hypot(m.vx,m.vy);if(sp>900){m.vx*=900/sp;m.vy*=900/sp}
  if(sp<25){m.st+=h;if(m.st>1.2){m.vy=-280;m.vx=(Math.random()-.5)*320;m.st=0}}else m.st=0;
  if(m.y>FY){m.f=true;R.fin.push(m);rFinish(R,m)}}
for(let a=0;a<ms.length;a++){const A=ms[a];if(A.f)continue;for(let b=a+1;b<ms.length;b++){const B=ms[b];if(B.f)continue;
  const dx=B.x-A.x,dy=B.y-A.y,d2=dx*dx+dy*dy;if(d2>=4*RR*RR||d2===0)continue;
  const d=Math.sqrt(d2),nx=dx/d,ny=dy/d,ov=(2*RR-d)/2;A.x-=nx*ov;A.y-=ny*ov;B.x+=nx*ov;B.y+=ny*ov;
  const rv=(B.vx-A.vx)*nx+(B.vy-A.vy)*ny;if(rv<0){const j=-1.6*rv/2;A.vx-=j*nx;A.vy-=j*ny;B.vx+=j*nx;B.vy+=j*ny}}}}

function rFinish(R,m){const MD=['🥇','🥈','🥉'],k=R.fin.length;
const li=document.createElement('li');li.innerHTML=`<span style="color:${m.c}">●</span> ${MD[k-1]||''} ${esc(m.n)}`;const l=$('#rlst');if(l)l.appendChild(li);
const c=$('#rcnt');if(c)c.textContent=`${k} / ${R.ms.length} 도착`;
if(k===1){const w=$('#rwin');if(w){w.innerHTML=`🏆 1등 <b>${esc(m.n)}</b>`;w.classList.add('show')}for(let n=0;n<4;n++)setTimeout(confetti,n*300)}
if(k===R.ms.length)R.phase='done'}

function rDraw(R){const {cv,ctx,C,ms}=R,dpr=window.devicePixelRatio||1,cw=cv.clientWidth,ch=cv.clientHeight;if(!cw||!ch)return;
if(cv.width!==Math.round(cw*dpr)||cv.height!==Math.round(ch*dpr)){cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr)}
const sc=cw/RW,vh=ch/sc;let lead=null;for(const m of ms)if(!m.f&&(!lead||m.y>lead.y))lead=m;
const tgt=Math.max(-30,Math.min(RH-vh,(lead?lead.y:RH)-vh*.45));R.cam+=(tgt-R.cam)*(R.phase==='count'?1:.08);
ctx.setTransform(dpr*sc,0,0,dpr*sc,0,-R.cam*dpr*sc);ctx.fillStyle='#fffdf5';ctx.fillRect(0,R.cam,RW,vh);
for(let x=0;x<RW;x+=16){const o=(x/16)%2;ctx.fillStyle=o?'#4a3b52':'#fff';ctx.fillRect(x,FY,16,8);ctx.fillStyle=o?'#fff':'#4a3b52';ctx.fillRect(x,FY+8,16,8)}
ctx.lineCap='round';ctx.strokeStyle='#4a3b52';ctx.lineWidth=4;for(const s of C.S){ctx.beginPath();ctx.moveTo(s[0],s[1]);ctx.lineTo(s[2],s[3]);ctx.stroke()}
ctx.lineWidth=2;for(const p of C.P){ctx.beginPath();ctx.arc(p[0],p[1],p[2],0,7);ctx.fillStyle='#ff8fab';ctx.fill();ctx.stroke()}
for(const s of C.SP){const c=Math.cos(s.a)*s.l/2,d=Math.sin(s.a)*s.l/2;ctx.lineWidth=14;ctx.strokeStyle='#4a3b52';ctx.beginPath();ctx.moveTo(s.x-c,s.y-d);ctx.lineTo(s.x+c,s.y+d);ctx.stroke();
  ctx.lineWidth=8;ctx.strokeStyle='#f7b731';ctx.stroke();ctx.beginPath();ctx.arc(s.x,s.y,5,0,7);ctx.fillStyle='#4a3b52';ctx.fill()}
ctx.font="15px Jua, 'Malgun Gothic', sans-serif";ctx.textAlign='center';ctx.lineJoin='round';
for(const m of ms){if(m.f)continue;ctx.beginPath();ctx.arc(m.x,m.y,RR,0,7);ctx.fillStyle=m.c;ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle='#4a3b52';ctx.stroke();
  const lb=(m===lead&&R.phase==='run'?'👑 ':'')+m.n;ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.strokeText(lb,m.x,m.y-RR-5);ctx.fillStyle='#4a3b52';ctx.fillText(lb,m.x,m.y-RR-5)}
ctx.setTransform(dpr,0,0,dpr,0,0);
if(R.phase==='count'){const n=Math.ceil(R.cd);ctx.font=`${Math.min(cw,ch)*.28}px Jua, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineWidth=10;ctx.strokeStyle='#fff';ctx.strokeText(n,cw/2,ch/2);ctx.fillStyle='#ff8fab';ctx.fillText(n,cw/2,ch/2);ctx.textBaseline='alphabetic'}
const pg=Math.max(0,Math.min(1,(lead?lead.y:FY)/FY));ctx.fillStyle='rgba(74,59,82,.15)';ctx.fillRect(cw-8,0,8,ch);ctx.fillStyle='#4cc38a';ctx.fillRect(cw-8,0,8,ch*pg)}

function raceRun(ns){const o=$('#rov');if(!o)return;raceStop();o.onclick=null;
o.innerHTML=`<div class="card race"><div class="row"><h2 style="margin:0">🎱 구슬 레이스</h2><span class="tag" id="rcnt" style="margin:0">0 / ${ns.length} 도착</span></div>
<div class="rbox"><div class="rcw"><canvas id="rcv"></canvas><div class="rwin" id="rwin"></div></div><ol class="rlist" id="rlst"></ol></div>
<div style="margin-top:14px"><button class="btn sm" id="rre">🔁 다시 달리기</button> <button class="btn sm alt" id="red">✏️ 이름 바꾸기</button> <button class="btn sm alt" id="rcl">닫기</button></div></div>`;
$('#rre').onclick=()=>raceRun(ns);$('#red').onclick=()=>raceSetup(ns);$('#rcl').onclick=raceClose;
const sh=[...ns];for(let k=sh.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[sh[k],sh[j]]=[sh[j],sh[k]]}
const cols=Math.min(sh.length,15),gap=(RW-60)/cols;
const ms=sh.map((n,k)=>({n,x:30+gap*((k%cols)+.5)+(Math.random()-.5)*4,y:40+Math.floor(k/cols)*28,vx:(Math.random()-.5)*30,vy:0,st:0,f:false,c:`hsl(${Math.round(k*360/sh.length)},85%,68%)`}));
const cv=$('#rcv'),R={cv,ctx:cv.getContext('2d'),C:raceCourse(),ms,fin:[],cam:-30,phase:'count',cd:3,last:0,raf:0,t:0};race=R;window.__race=R;
const loop=ts=>{if(race!==R||!document.body.contains(cv))return;const dt=R.last?Math.min(.033,(ts-R.last)/1000):0;R.last=ts;
  if(R.phase==='count'){R.cd-=dt;if(R.cd<=0)R.phase='run'}
  else if(R.phase==='run'){R.t+=dt;for(let k=0;k<6;k++)rStep(R,dt/6)}
  rDraw(R);if(R.phase!=='done')R.raf=requestAnimationFrame(loop)};
R.raf=requestAnimationFrame(loop)}

home();
</script>
</body></html>
